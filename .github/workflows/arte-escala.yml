name: Arte da Escala

# QUEM DÁ A PARTIDA AGORA É O CRON DA VERCEL (vercel.json → /api/cron-arte),
# domingo 22h BRT. O `schedule:` do GitHub foi REMOVIDO de propósito: ele não tem
# hora — nas duas únicas execuções agendadas que existiram, atrasou 3h e 3h38, e a
# arte de domingo à noite saía perto das 2h da manhã de segunda.
# O workflow_dispatch continua: é por ele que a Vercel dispara (na hora), e é o que
# o botão "Gerar/Atualizar" da tela de Escala usa (api/regenerar-arte.js).
# NÃO recolocar o schedule aqui sem tirar o cron da Vercel, senão gera duas vezes.
on:
  workflow_dispatch:
    inputs:
      origem:
        description: 'Quem pediu: cron (robô de domingo) ou manual (botão da Escala)'
        required: false
        default: 'manual'

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar deps (baixa o Chromium do puppeteer)
        run: npm ci
        working-directory: arte-escala
      - name: Gerar e publicar a arte
        run: node gerar.mjs
        working-directory: arte-escala
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Desde que o agendamento saiu do GitHub, TODA execução é workflow_dispatch —
          # então deduzir a origem do tipo do evento passou a carimbar "manual" até nas
          # do robô, e o banco deixou de saber quem gerou o quê. Agora quem dispara diz.
          # O valor é fechado nestas duas opções de propósito: só entra no ambiente o que
          # esta linha decide, nunca o texto cru de quem chamou.
          GERADO_POR: ${{ github.event.inputs.origem == 'cron' && 'cron' || 'manual' }}
          # Avisar a coordenação por push quando a arte ficar pronta.
          # Se estes dois secrets não existirem, o robô só pula o aviso (a arte é gerada do mesmo jeito).
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
