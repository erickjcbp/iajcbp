<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CRM — Acólitos JCBP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#150a0d">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;});</script>
  <style>
    .view-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
    .view-btn {
      padding: 8px 18px; min-height: 40px; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text-muted); border-radius: 2px;
      cursor: pointer; font-family: 'Sora', sans-serif; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .view-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.08); }
    .list-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
    .list-table th {
      text-align: left; padding: 9px 12px; font-family: 'Sora', sans-serif;
      font-size: 10px; letter-spacing: 1.5px; color: var(--text-muted);
      border-bottom: 1px solid var(--border-wine); white-space: nowrap; text-transform: uppercase;
    }
    .list-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .days-pill {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-family: 'Sora', sans-serif; border: 1px solid;
    }
    .days-pill.ok   { background: rgba(30,80,30,.2); color: var(--success-text); border-color: var(--success); }
    .days-pill.warn { background: rgba(120,60,0,.2); color: var(--warn-text); border-color: var(--warn); }
    .etapa-badge {
      display: inline-block; padding: 2px 8px; border-radius: 2px;
      font-size: 10px; font-family: 'Sora', sans-serif; letter-spacing: .5px;
      background: rgba(201,168,76,.1); color: var(--gold); border: 1px solid var(--gold-dim);
    }
    .crm-wa { display:inline-block; margin-top:8px; padding:5px 10px; background:rgba(37,211,102,.14); border:1px solid #25d366; color:#25d366; border-radius:14px; font-size:11px; font-weight:700; text-decoration:none; -webkit-tap-highlight-color:transparent; }
    .crm-wa:active { background:rgba(37,211,102,.25); }
    .crm-wa.sm { margin-top:0; padding:4px 8px; font-size:14px; line-height:1; }
  </style>
  <script src="/projetos/acolitos/vendor/supabase-js-2.106.2.min.js"></script>
</head>
<body>
<div id="app-header"></div>
<div id="app-nav"></div>

<div class="main">
  <div class="kpi-grid" id="crm-kpis"></div>
  <h1 class="page-title">Pipeline de Integração</h1>

  <div class="view-toggle">
    <button class="view-btn active" id="btn-v-pipeline" onclick="setView('pipeline')">Pipeline</button>
    <button class="view-btn" id="btn-v-lista" onclick="setView('lista')">Lista</button>
  </div>

  <div id="view-pipeline" class="crm-pipeline"></div>

  <div id="view-lista" style="display:none;overflow-x:auto;">
    <table class="list-table">
      <thead>
        <tr>
          <th>Nome</th><th>Idade</th><th>Etapa</th>
          <th>Dias</th><th>Entrada</th><th>Ação</th>
        </tr>
      </thead>
      <tbody id="crm-tbody"></tbody>
    </table>
  </div>
</div>

<!-- Modal avançar etapa -->
<!-- Cartão da pessoa: gaveta que abre pelo lado (no celular, tela cheia). -->
<div id="cartao-fundo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;"></div>
<aside id="cartao" style="display:none;position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:401;
        background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;
        -webkit-overflow-scrolling:touch;box-shadow:-8px 0 24px rgba(0,0,0,.35);">
  <div style="position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);
              padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2;">
    <div style="flex:1;min-width:0;">
      <div id="cartao-nome" style="font-weight:800;font-size:16px;color:var(--gold-light);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
      <div id="cartao-sub" style="font-size:12px;color:var(--text-muted);margin-top:2px;"></div>
    </div>
    <button id="cartao-fechar" style="border:1px solid var(--border);background:var(--surface2);
            color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;">×</button>
  </div>
  <div id="cartao-ficha" style="padding:14px 16px;"></div>
  <div style="padding:0 16px 14px;">
    <div style="font-weight:700;font-size:13px;color:var(--gold-light);margin-bottom:8px;">Linha do tempo</div>
    <div id="cartao-linha"></div>
  </div>
  <div style="position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;">
    <textarea id="cartao-texto" class="form-input" rows="2" placeholder="Escrever um comentário…"
              style="resize:vertical;"></textarea>
    <button id="cartao-comentar" class="btn-sm gold" style="width:100%;margin-top:8px;">Comentar</button>
  </div>
</aside>

<div class="modal-overlay" id="modal-avancar">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Avançar Etapa</div>
    <p id="modal-desc" style="color:var(--text-muted);font-size:13px;margin-bottom:16px;line-height:1.5;"></p>

    <div id="bloco-role" style="display:none;" class="form-group">
      <label class="form-label">Definir nível do membro</label>
      <select class="form-select" id="sel-role">
        <option value="aspirante">Aspirante — em fase inicial</option>
        <option value="coroinha">Coroinha — funções básicas</option>
        <option value="acolito">Acólito — funções de altar</option>
        <option value="cerimonario">Cerimoniário — conduz a celebração</option>
        <option value="membro_equipe">Equipe — coordenação da pastoral</option>
      </select>
    </div>

    <div class="form-group" style="margin-top:12px;">
      <label class="form-label">Comentário (obrigatório)</label>
      <textarea class="form-input" id="modal-obs" rows="2"
                placeholder="O que aconteceu nesta etapa? Fica na linha do tempo da pessoa."
                style="resize:vertical;"></textarea>
      <p style="font-size:11px;color:var(--text-muted);margin:6px 0 0;line-height:1.5;">
        Daqui a seis meses ninguém lembra por que esta pessoa avançou ou voltou. Escrito, lembra.
      </p>
    </div>

    <div class="modal-actions" style="flex-wrap:wrap;gap:8px;">
      <button class="btn-sm red" id="btn-recusar" onclick="recusarCadastro()" style="display:none;">⛔ Recusar</button>
      <button class="btn-sm wine" id="btn-excluir" onclick="excluirEntry()" style="margin-right:auto;">🗑 Tirar do funil</button>
      <button class="btn-sm gray" id="btn-voltar" onclick="voltarEtapa()" style="display:none;">◀ Voltar etapa</button>
      <button class="btn-sm gray" onclick="fecharModal()">Cancelar</button>
      <button class="btn-sm gold" id="btn-confirmar" onclick="confirmarAvancar()">Avançar ▶</button>
    </div>
  </div>
</div>

<script src="navegacao-core.js"></script>
<script src="portao-notificacoes-core.js"></script>
<script src="boas-vindas-core.js"></script>
<script src="shared.js"></script>
<script>
// Etapas padrão (fallback). O Config (cfg('crm_etapas') = lista ordenada) substitui tudo no init.
let ETAPAS = ['aprovacao_cadastro','integracao','whatsapp','tunica','disponivel_escala','integrado'];
let ETAPA_LABEL = {
  aprovacao_cadastro:'Aprovação', integracao:'Integração', whatsapp:'WhatsApp', tunica:'Túnica',
  disponivel_escala:'Disp. Escala', integrado:'Integrado'
};
let ETAPA_ACAO = {
  aprovacao_cadastro:'Aprovar o cadastro. O membro segue para a etapa de integração.',
  integracao:      'Reunião de integração realizada com o membro.',
  whatsapp:        'Entrada nos grupos de WhatsApp confirmada.',
  tunica:          'Recebimento da túnica confirmado.',
  disponivel_escala:'Disponibilidade preenchida. Membro pronto para ser escalado.',
  integrado:       'Membro totalmente integrado! Defina o nível pastoral.'
};

let ctx = null;
let crmData = [];
let pendingEntry = null;
let currentView = 'pipeline';

async function init() {
  ctx = await initModulo(['coord_admin','subadmin','membro_equipe'], { perm: 'crm' });
  if (!ctx) return;
  // Etapas vêm do Config (lista ordenada de {slug,label,acao}); senão usa o padrão
  const _ov = (typeof cfg === 'function') ? cfg('crm_etapas', null) : null;
  if (Array.isArray(_ov) && _ov.length) {
    ETAPAS = _ov.map(e => e.slug);
    ETAPA_LABEL = {}; ETAPA_ACAO = {};
    _ov.forEach(e => { ETAPA_LABEL[e.slug] = e.label || e.slug; ETAPA_ACAO[e.slug] = e.acao || ''; });
  }
  renderHeader(ctx, 'crm');
  renderBottomNav(ctx, 'crm');
  await loadCrm();
  document.getElementById('cartao-fechar').onclick = fecharCartao;
  document.getElementById('cartao-fundo').onclick = fecharCartao;
  document.getElementById('cartao-comentar').onclick = comentarNoCartao;
}

async function loadCrm() {
  const { data } = await sbAdmin
    .from('acolitos_crm')
    // A ficha INTEIRA: o cartão da pessoa mostra tudo o que o cadastro sabe dela.
    // Antes vinham sete campos e o resto — sacramentos, família, endereço, irmãos —
    // ficava invisível justamente para quem decide se a pessoa entra.
    .select('*, acolitos_membros(*)')
    .neq('etapa','integrado')
    .order('etapa_iniciada_em', { ascending: true });
  crmData = data || [];
  renderKpis();
  currentView === 'pipeline' ? renderPipeline() : renderLista();
}

function renderKpis() {
  const el = document.getElementById('crm-kpis');
  el.textContent = '';
  const total    = crmData.length;
  const aprovar  = crmData.filter(c => c.etapa === 'aprovacao_cadastro').length;
  const travados = crmData.filter(c => diasNaEtapa(c.etapa_iniciada_em) > 30).length;
  const quaseLa  = crmData.filter(c => c.etapa === 'disponivel_escala').length;
  [
    { label:'Aguard. Aprovação', value: aprovar,  sub: 'novos cadastros' },
    { label:'Em Onboarding',     value: total,    sub: 'no total' },
    { label:'Travados +30d',     value: travados, sub: 'precisam atenção' },
    { label:'Quase lá',          value: quaseLa,  sub: 'disp. escala' },
  ].forEach(k => {
    const card = document.createElement('div'); card.className = 'kpi-card';
    const lbl = document.createElement('div'); lbl.className = 'kpi-label'; lbl.textContent = k.label;
    const val = document.createElement('div'); val.className = 'kpi-value'; val.textContent = k.value;
    const sub = document.createElement('div'); sub.className = 'kpi-sub';   sub.textContent = k.sub;
    card.append(lbl, val, sub); el.appendChild(card);
  });
}

function renderPipeline() {
  const el = document.getElementById('view-pipeline');
  el.textContent = '';
  ETAPAS.slice(0,-1).forEach(etapa => {
    const membros = crmData.filter(c => c.etapa === etapa);

    const col = document.createElement('div'); col.className = 'crm-col';

    // Header da coluna
    const hdr = document.createElement('div'); hdr.className = 'crm-col-header';
    const htitle = document.createElement('span'); htitle.textContent = ETAPA_LABEL[etapa];
    const hcount = document.createElement('span');
    hcount.style.cssText = 'background:var(--wine-dim);color:var(--text);border-radius:10px;padding:1px 7px;font-size:10px;';
    hcount.textContent = membros.length;
    hdr.append(htitle, hcount);

    // Body da coluna
    const body = document.createElement('div'); body.className = 'crm-col-body';
    if (!membros.length) {
      const empty = document.createElement('span');
      empty.style.cssText = 'color:var(--text-muted);font-size:11px;font-style:italic;padding:8px 0;text-align:center;';
      empty.textContent = 'Nenhum';
      body.appendChild(empty);
    }
    membros.forEach(c => {
      const m = c.acolitos_membros;
      const dias = diasNaEtapa(c.etapa_iniciada_em);
      const card = document.createElement('div'); card.className = 'crm-card';
      card.onclick = () => abrirCartao(c);

      const name = document.createElement('div'); name.className = 'crm-card-name';
      name.textContent = m?.nome || '—';

      const meta = document.createElement('div'); meta.className = 'crm-card-meta';
      meta.textContent = m?.data_nascimento ? calcIdade(m.data_nascimento) + ' anos' : '—';

      const daysEl = document.createElement('div');
      daysEl.className = 'crm-card-days' + (dias > 30 ? ' alert' : '');
      daysEl.textContent = dias + ' dias nesta etapa';

      card.append(name, meta, daysEl);
      const wlink = waMembro(m);
      if (wlink) {
        const wa = document.createElement('a'); wa.className = 'crm-wa'; wa.href = wlink; wa.target = '_blank'; wa.rel = 'noopener';
        wa.textContent = '💬 WhatsApp'; wa.onclick = (e) => e.stopPropagation(); // não abre o modal da etapa
        card.appendChild(wa);
      }
      body.appendChild(card);
    });

    col.append(hdr, body);
    el.appendChild(col);
  });
}

function renderLista() {
  const tbody = document.getElementById('crm-tbody');
  tbody.textContent = '';
  if (!crmData.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td'); td.colSpan = 6; td.className = 'empty';
    td.textContent = 'Nenhum membro em onboarding.';
    tr.appendChild(td); tbody.appendChild(tr); return;
  }
  crmData.forEach(c => {
    const m = c.acolitos_membros;
    const dias = diasNaEtapa(c.etapa_iniciada_em);
    const tr = document.createElement('tr');

    const tdNome = document.createElement('td');
    const linkNome = document.createElement('a');
    linkNome.textContent = m?.nome || '—';
    linkNome.style.cssText = 'color:var(--gold-light);cursor:pointer;text-decoration:none;font-weight:600;';
    linkNome.onclick = () => abrirCartao(c);
    tdNome.appendChild(linkNome);
    const tdIdade = document.createElement('td');
    tdIdade.textContent = m?.data_nascimento ? calcIdade(m.data_nascimento) + 'a' : '—';

    const tdEtapa = document.createElement('td');
    const etBadge = document.createElement('span'); etBadge.className = 'etapa-badge';
    etBadge.textContent = ETAPA_LABEL[c.etapa] || c.etapa; tdEtapa.appendChild(etBadge);

    const tdDias = document.createElement('td');
    const pill = document.createElement('span');
    pill.className = 'days-pill ' + (dias > 30 ? 'warn' : 'ok');
    pill.textContent = dias + 'd'; tdDias.appendChild(pill);

    const tdData = document.createElement('td'); tdData.textContent = formatDate(c.etapa_iniciada_em);

    const tdAcao = document.createElement('td');
    tdAcao.style.cssText = 'display:flex;gap:6px;align-items:center;';
    const wlink = waMembro(m);
    if (wlink) { const wa = document.createElement('a'); wa.className = 'crm-wa sm'; wa.href = wlink; wa.target = '_blank'; wa.rel = 'noopener'; wa.title = 'WhatsApp'; wa.textContent = '💬'; tdAcao.appendChild(wa); }
    const btn = document.createElement('button'); btn.className = 'btn-sm gold';
    btn.textContent = 'Avançar'; btn.onclick = () => abrirModal(c);
    tdAcao.appendChild(btn);

    tr.append(tdNome, tdIdade, tdEtapa, tdDias, tdData, tdAcao);
    tbody.appendChild(tr);
  });
}

// ── CARTÃO DA PESSOA ──────────────────────────────────────────────────
// Quem decide se alguém entra na pastoral precisa ver a pessoa inteira, não
// cinco colunas de tabela. Aqui está tudo o que o cadastro sabe — e, junto,
// a linha do tempo: comentários e mudanças de etapa na ordem em que
// aconteceram, cada um com quem fez e quando.
let cartaoEntry = null;
const autoresCache = {};

const SIMNAO = v => v === null || v === undefined ? '—' : (v ? 'Sim' : 'Não');
const OU = v => (v === null || v === undefined || String(v).trim() === '') ? '—' : String(v);

function bloco(titulo, linhas) {
  const vivas = linhas.filter(l => l[1] !== '—' || l[2] === 'sempre');
  if (!vivas.length) return null;
  const cx = document.createElement('div'); cx.style.cssText = 'margin-bottom:14px;';
  const t = document.createElement('div');
  t.style.cssText = 'font-weight:700;font-size:12px;color:var(--gold-light);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;';
  t.textContent = titulo; cx.appendChild(t);
  vivas.forEach(([rot, val]) => {
    const l = document.createElement('div');
    l.style.cssText = 'display:flex;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--border);';
    const a = document.createElement('span'); a.style.cssText = 'color:var(--text-muted);min-width:140px;'; a.textContent = rot;
    const b = document.createElement('span'); b.style.cssText = 'flex:1;color:var(--text);word-break:break-word;'; b.textContent = val;
    l.append(a, b); cx.appendChild(l);
  });
  return cx;
}

async function abrirCartao(entry) {
  cartaoEntry = entry;
  const m = entry.acolitos_membros || {};
  document.getElementById('cartao-nome').textContent = m.nome || '—';
  document.getElementById('cartao-sub').textContent =
    (ETAPA_LABEL[entry.etapa] || entry.etapa) + ' · há ' + diasNaEtapa(entry.etapa_iniciada_em) + ' dias nesta etapa';
  document.getElementById('cartao-fundo').style.display = '';
  document.getElementById('cartao').style.display = '';
  document.getElementById('cartao-texto').value = '';

  const ficha = document.getElementById('cartao-ficha'); ficha.textContent = '';
  const idade = m.data_nascimento ? calcIdade(m.data_nascimento) + ' anos' : '—';
  const COM = { matriz:'Matriz', santo_antonio:'Santo Antônio', outra:'Outra' };

  // Irmãos na pastoral: quem mais está no mesmo grupo.
  let irmaos = '—';
  if (m.grupo_irmaos) {
    const { data: irm } = await sbAdmin.from('acolitos_membros')
      .select('nome').eq('grupo_irmaos', m.grupo_irmaos).neq('id', m.id);
    if (irm && irm.length) irmaos = irm.map(x => x.nome).join(', ');
  }

  [
    bloco('Quem é', [
      ['Idade', idade],
      ['Nascimento', m.data_nascimento ? formatDate(m.data_nascimento) : '—'],
      ['Apelido', OU(m.apelido)],
      ['Comunidade', COM[m.comunidade] || OU(m.comunidade)],
      ['Situação no cadastro', ({ ativo:'Ativo', afastado:'Afastado', em_integracao:'Em integração', desligado:'Desligado' })[m.status] || OU(m.status)],
      ['Entrou no app em', m.created_at ? formatDate(m.created_at) : '—'],
      ['Tem login', m.user_id ? 'Sim' : 'Não', 'sempre'],
    ]),
    bloco('Caminhada na igreja', [
      ['Batizado', SIMNAO(m.batismo), 'sempre'],
      ['Primeira Eucaristia', SIMNAO(m.primeira_eucaristia), 'sempre'],
      ['Crisma', SIMNAO(m.crisma), 'sempre'],
      ['Já foi investido', SIMNAO(m.investido), 'sempre'],
      ['Túnica própria', SIMNAO(m.tem_tunica), 'sempre'],
    ]),
    bloco('Família', [
      ['Pai', OU(m.nome_pai)],
      ['Mãe', OU(m.nome_mae)],
      ['Responsável', OU(m.responsavel)],
      ['Pais são ministros', SIMNAO(m.tem_pai_ministro || m.tem_mae_ministro), 'sempre'],
      ['Irmãos na pastoral', irmaos],
      ['Escalar junto com irmão', m.escalar_com_irmao ? 'Sim' : '—'],
      ['Escalar junto com os pais', m.escalar_com_pais ? 'Sim' : '—'],
    ]),
    bloco('Contato', [
      ['Celular', OU(m.telefone) + (m.telefone_whatsapp ? ' (WhatsApp)' : '')],
      ['Celular da mãe', OU(m.celular_mae)],
      ['Recado', OU(m.celular_recado) + (m.responsavel_whatsapp ? ' (WhatsApp)' : '')],
      ['No grupo do WhatsApp', SIMNAO(m.no_grupo_whatsapp), 'sempre'],
      ['Endereço', OU(m.endereco)],
    ]),
    bloco('Cuidados e anotações', [
      ['Necessidades especiais', OU(m.necessidades_especiais)],
      ['Observações da ficha', OU(m.observacoes)],
    ]),
  ].filter(Boolean).forEach(x => ficha.appendChild(x));

  // O que falta — a lista que diz o que perguntar na próxima conversa.
  const falta = [];
  if (!m.data_nascimento) falta.push('data de nascimento');
  if (!m.telefone && !m.celular_recado && !m.celular_mae) falta.push('nenhum telefone');
  if (!m.endereco) falta.push('endereço');
  if (!m.nome_mae && !m.nome_pai && !m.responsavel) falta.push('nome de responsável');
  if (!m.batismo) falta.push('batismo');
  if (!m.no_grupo_whatsapp) falta.push('entrar no grupo do WhatsApp');
  if (falta.length) {
    const av = document.createElement('div');
    av.style.cssText = 'border:1px solid var(--gold-dim);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--text-muted);';
    av.innerHTML = '<b style="color:var(--gold-light);">Falta nesta ficha:</b> ' + escHtml(falta.join(' · '));
    ficha.appendChild(av);
  }

  const acao = document.createElement('button');
  acao.className = 'btn-sm gold'; acao.style.cssText = 'width:100%;margin:12px 0 4px;';
  acao.textContent = 'Avançar etapa / mover';
  acao.onclick = () => { fecharCartao(); abrirModal(entry); };
  ficha.appendChild(acao);

  await carregarLinhaDoTempo(m.id, entry);
}

function fecharCartao() {
  document.getElementById('cartao').style.display = 'none';
  document.getElementById('cartao-fundo').style.display = 'none';
  cartaoEntry = null;
}

async function nomesDosAutores(ids) {
  const faltam = ids.filter(i => i && !(i in autoresCache));
  if (faltam.length) {
    const { data } = await sbAdmin.from('acolitos_membros').select('user_id,nome').in('user_id', faltam);
    faltam.forEach(i => { autoresCache[i] = null; });
    (data || []).forEach(x => { autoresCache[x.user_id] = x.nome; });
  }
  return autoresCache;
}

async function carregarLinhaDoTempo(membroId, entry) {
  const alvo = document.getElementById('cartao-linha');
  alvo.innerHTML = '<span class="loading">Carregando...</span>';
  const [{ data: coms }, { data: hist }] = await Promise.all([
    sbAdmin.from('acolitos_crm_comentarios').select('*').eq('membro_id', membroId).order('quando'),
    sbAdmin.from('acolitos_crm_historico').select('*').eq('membro_id', membroId).order('changed_at'),
  ]);
  const itens = []
    .concat((coms || []).map(c => ({ quando: c.quando, autor: c.autor_id, tipo: 'comentario', texto: c.texto, de: c.etapa_de, para: c.etapa_para })))
    .concat((hist || []).map(h => ({ quando: h.changed_at, autor: h.changed_by, tipo: 'mudanca', de: h.etapa_de, para: h.etapa_para })))
    .sort((a, b) => String(a.quando).localeCompare(String(b.quando)));
  await nomesDosAutores(itens.map(i => i.autor));
  alvo.textContent = '';
  if (!itens.length) {
    const p = document.createElement('p'); p.style.cssText = 'font-size:12px;color:var(--text-muted);';
    p.textContent = 'Nada registrado ainda. O primeiro comentário aparece aqui.';
    alvo.appendChild(p); return;
  }
  // Uma mudança de etapa e o comentário que a explicou chegam juntos: quando os dois
  // apontam para a mesma transição, o texto entra na própria linha da mudança.
  const usados = new Set();
  itens.forEach((it, i) => {
    if (usados.has(i)) return;
    const cx = document.createElement('div');
    cx.style.cssText = 'border-left:2px solid var(--gold-dim);padding:6px 0 10px 10px;margin-bottom:2px;';
    const cab = document.createElement('div');
    cab.style.cssText = 'font-size:11px;color:var(--text-muted);margin-bottom:3px;';
    const quem = autoresCache[it.autor] || 'alguém da coordenação';
    cab.textContent = quem + ' · ' + formatDate(it.quando);
    const corpo = document.createElement('div'); corpo.style.cssText = 'font-size:13px;color:var(--text);line-height:1.5;';
    if (it.tipo === 'mudanca') {
      const par = itens.findIndex((o, j) => j !== i && o.tipo === 'comentario' && o.para === it.para && o.de === it.de
                                    && Math.abs(new Date(o.quando) - new Date(it.quando)) < 60000);
      const rot = (ETAPA_LABEL[it.de] || it.de || '—') + ' → ' + (ETAPA_LABEL[it.para] || it.para || '—');
      corpo.innerHTML = '<b>' + escHtml(rot) + '</b>';
      if (par >= 0) { usados.add(par); corpo.innerHTML += '<br>' + escHtml(itens[par].texto); }
    } else {
      corpo.textContent = it.texto;
    }
    cx.append(cab, corpo); alvo.appendChild(cx);
  });
}

async function salvarComentario(membroId, texto, etapa, de, para) {
  const { error } = await sbAdmin.from('acolitos_crm_comentarios').insert({
    membro_id: membroId, autor_id: ctx.user.id, texto: texto,
    etapa: etapa || null, etapa_de: de || null, etapa_para: para || null,
  });
  return !error;
}

async function comentarNoCartao() {
  if (!cartaoEntry) return;
  const el = document.getElementById('cartao-texto');
  const txt = el.value.trim();
  if (!txt) { await uiAlert('Escreva algo antes de comentar.'); return; }
  const btn = document.getElementById('cartao-comentar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const ok = await salvarComentario(cartaoEntry.membro_id, txt, cartaoEntry.etapa, null, null);
  btn.disabled = false; btn.textContent = 'Comentar';
  if (!ok) { await uiAlert('Não consegui salvar o comentário.'); return; }
  el.value = '';
  await carregarLinhaDoTempo(cartaoEntry.membro_id, cartaoEntry);
}

function setView(view) {
  currentView = view;
  document.getElementById('view-pipeline').style.display = view === 'pipeline' ? '' : 'none';
  document.getElementById('view-lista').style.display    = view === 'lista'    ? '' : 'none';
  document.getElementById('btn-v-pipeline').classList.toggle('active', view === 'pipeline');
  document.getElementById('btn-v-lista').classList.toggle('active', view === 'lista');
  view === 'pipeline' ? renderPipeline() : renderLista();
}

function abrirModal(entry) {
  pendingEntry = entry;
  const idx = ETAPAS.indexOf(entry.etapa);
  const prox = ETAPAS[idx + 1];
  const nome = entry.acolitos_membros?.nome || '—';
  const podeAtribuirRole = ['coord_admin','subadmin'].includes(ctx.membership.role);

  document.getElementById('modal-title').textContent = nome;
  document.getElementById('modal-desc').textContent = ETAPA_ACAO[entry.etapa];
  document.getElementById('modal-obs').value = '';
  // Seletor de role só aparece para coord_admin/subadmin ao integrar
  document.getElementById('bloco-role').style.display =
    (prox === 'integrado' && podeAtribuirRole) ? '' : 'none';
  document.getElementById('btn-voltar').style.display = idx > 0 ? '' : 'none';
  document.getElementById('btn-recusar').style.display = entry.etapa === 'aprovacao_cadastro' ? '' : 'none';
  document.getElementById('modal-avancar').classList.add('open');
}

async function recusarCadastro() {
  if (!pendingEntry) return;
  const nome = pendingEntry.acolitos_membros?.nome || 'este cadastro';
  if (!await uiConfirm('RECUSAR e APAGAR o cadastro de ' + nome + '?\n\nRemove o membro, o funil, o histórico E a conta de acesso — não dá pra desfazer.\n(Para só tirar do funil sem apagar, use "Tirar do funil".)')) return;
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch('/api/acolito-admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session ? session.access_token : '') },
    body: JSON.stringify({ action: 'reject', membro_id: pendingEntry.membro_id })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { await uiAlert(d.error || 'Não foi possível apagar.'); return; }
  fecharModal(); pendingEntry = null; await loadCrm();
}

async function voltarEtapa() {
  if (!pendingEntry) return;
  const idx = ETAPAS.indexOf(pendingEntry.etapa);
  if (idx <= 0) return;
  const anterior = ETAPAS[idx - 1];
  const obsV = document.getElementById('modal-obs').value.trim();
  // Voltar é justamente o movimento que mais precisa de explicação.
  if (!obsV) { await uiAlert('Escreva um comentário explicando por que está voltando a etapa.'); return; }
  if (!await uiConfirm('Voltar ' + (pendingEntry.acolitos_membros?.nome || 'este membro') + ' para a etapa "' + ETAPA_LABEL[anterior] + '"?')) return;
  await sbAdmin.from('acolitos_crm').update({ etapa: anterior, etapa_iniciada_em: new Date().toISOString() }).eq('membro_id', pendingEntry.membro_id);
  await sbAdmin.from('acolitos_crm_historico').insert({ membro_id: pendingEntry.membro_id, etapa_de: pendingEntry.etapa, etapa_para: anterior, changed_by: ctx.user.id });
  await salvarComentario(pendingEntry.membro_id, obsV, pendingEntry.etapa, pendingEntry.etapa, anterior);
  fecharModal(); pendingEntry = null; await loadCrm();
}

async function excluirEntry() {
  if (!pendingEntry) return;
  const nome = pendingEntry.acolitos_membros?.nome || 'este membro';
  const obsX = document.getElementById('modal-obs').value.trim();
  // A pessoa continua no cadastro, então o comentário sobrevive e explica a saída.
  if (!obsX) { await uiAlert('Escreva um comentário explicando por que está tirando do funil.'); return; }
  await salvarComentario(pendingEntry.membro_id, obsX, pendingEntry.etapa, null, null);
  if (!await uiConfirm('Remover ' + nome + ' do funil de integração?\n(O cadastro do membro não é apagado — só sai do CRM.)')) return;
  await sbAdmin.from('acolitos_crm_historico').delete().eq('membro_id', pendingEntry.membro_id);
  const { error } = await sbAdmin.from('acolitos_crm').delete().eq('membro_id', pendingEntry.membro_id);
  if (error) { await uiAlert('Não foi possível remover. Tente novamente.'); return; }
  fecharModal(); pendingEntry = null; await loadCrm();
}

async function confirmarAvancar() {
  if (!pendingEntry) return;
  const btn = document.getElementById('btn-confirmar');
  btn.disabled = true; btn.textContent = 'Salvando...';

  const etapaAtual = pendingEntry.etapa;
  const idx = ETAPAS.indexOf(etapaAtual);
  const proximaEtapa = ETAPAS[idx + 1];
  const obs = document.getElementById('modal-obs').value.trim();
  // Obrigatório: sem isto, seis meses depois ninguém sabe por que a pessoa avançou.
  if (!obs) {
    await uiAlert('Escreva um comentário explicando a mudança. Ele fica na linha do tempo da pessoa.');
    btn.disabled = false; btn.textContent = 'Confirmar'; return;
  }
  const roleFinal = document.getElementById('sel-role').value;
  const membroId = pendingEntry.membro_id;

  // Avança etapa no CRM
  // O texto NÃO vai mais para `observacoes`: aquele campo era um só por pessoa e se
  // sobrescrevia a cada etapa. Agora vira comentário, que fica para sempre.
  await sbAdmin.from('acolitos_crm').update({
    etapa: proximaEtapa,
    etapa_iniciada_em: new Date().toISOString()
  }).eq('membro_id', membroId);
  await salvarComentario(membroId, obs, etapaAtual, etapaAtual, proximaEtapa);

  // Registra histórico
  await sbAdmin.from('acolitos_crm_historico').insert({
    membro_id: membroId,
    etapa_de: etapaAtual,
    etapa_para: proximaEtapa,
    changed_by: ctx.user.id
  });

  // Se integrado → "sobe" o membro (status ativo) e atualiza role (apenas coord_admin e subadmin)
  if (proximaEtapa === 'integrado') {
    await sbAdmin.from('acolitos_membros').update({ status: 'ativo' }).eq('id', membroId);
    const podeAtribuirRole = ['coord_admin','subadmin'].includes(ctx.membership.role);
    if (podeAtribuirRole) {
      const { data: membroRow } = await sb
        .from('acolitos_membros').select('user_id').eq('id', membroId).maybeSingle();
      const { data: modulo } = await sb
        .from('pastoral_modules').select('id').eq('slug','acolitos').maybeSingle();
      if (membroRow?.user_id && modulo) {
        // RLS com WITH CHECK garante que subadmin não pode atribuir coord_admin
        await sb.from('pastoral_members')
          .update({ role: roleFinal })
          .eq('user_id', membroRow.user_id)
          .eq('module_id', modulo.id);
      }
    }
  }

  fecharModal();
  btn.disabled = false; btn.textContent = 'Confirmar';
  pendingEntry = null;
  await loadCrm();
}

function fecharModal() {
  document.getElementById('modal-avancar').classList.remove('open');
}

init();
</script>
