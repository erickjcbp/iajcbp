  <style>
    .dest-member-overlay { padding:clamp(14px,2.4vw,44px); }
    .dest-member-modal { width:100%!important;max-width:none!important;max-height:calc(100dvh - 40px);overflow:auto;clip-path:none!important;border-radius:16px!important;padding:clamp(20px,3vw,40px)!important; }
    .dest-member-layout { display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px; }
    .dest-member-profile,.dest-member-recent { min-width:0;padding:20px;border:1px solid var(--border-wine);border-radius:12px;background:var(--surface2); }
    .dest-member-head { display:flex;align-items:center;gap:20px;margin-bottom:24px;min-width:0; }
    .dest-member-name { font:700 clamp(21px,2.3vw,30px)/1.4 var(--font-title);color:var(--gold-light);margin:0;overflow-wrap:anywhere; }
    .dest-member-level { color:var(--text-muted);font-size:14px;line-height:1.6;margin-top:8px;overflow-wrap:anywhere; }
    .dest-member-stats { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0; }
    .dest-member-stat { display:flex;flex-direction:column; min-width:0;padding:14px 10px;border:1px solid var(--border-wine);border-radius:10px;background:var(--surface);text-align:center; }
    .dest-member-stat dd { order:-1; margin:0 0 8px;font:700 22px/1.4 var(--font-title);color:var(--gold-light);overflow-wrap:anywhere; }
    .dest-member-stat dt { font-size:13px;line-height:1.5;color:var(--text-muted);overflow-wrap:anywhere; }
    .dest-member-recent h3 { margin:0 0 14px;font:700 18px var(--font-title);color:var(--gold-light); }
    .dest-member-mass { display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--border);font-size:14px;line-height:1.6; }
    .dest-member-mass time { overflow-wrap:anywhere; }.dest-member-mass span { color:var(--gold-light);font-weight:700;text-align:right;overflow-wrap:anywhere; }
    .dest-member-status { padding:20px 0;font-size:14px;color:var(--text-muted);line-height:1.7; }
    .dest-member-actions { margin-top:20px;display:flex;justify-content:flex-end; }.dest-member-actions button,.dest-member-modal>.modal-close { min-height:44px;min-width:44px; }

    .dest-member-modal :focus-visible { outline:2px solid var(--gold);outline-offset:3px; }
    @media(max-width:1000px){.dest-member-layout{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:639px){.dest-member-overlay{padding:0!important;align-items:stretch}.dest-member-modal{height:100dvh!important;max-height:100dvh!important;border-radius:0!important;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))!important}.dest-member-layout{grid-template-columns:minmax(0,1fr);gap:14px}.dest-member-head{flex-direction:column;text-align:center;gap:14px}.dest-member-profile,.dest-member-recent{padding:14px}.dest-member-stats{gap:6px}.dest-member-stat{padding:12px 6px}.dest-member-stat dd{font-size:18px}.dest-member-stat dt{font-size:12px}.dest-member-actions button{width:100%}}
    .dest-tabs { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin-bottom:18px; }
    .dest-tab { flex:1 0 auto; min-width:0 !important;min-height:48px; padding:9px 12px; background:var(--surface2); border:1px solid var(--border); color:var(--text-muted); border-radius:18px; font-family:var(--font-body); font-size:11px; font-weight:700; white-space:normal; line-height:1.5; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .dest-tab.active { border-color:var(--gold); color:var(--gold); background:rgba(232,185,74,.1); }
    .dest-head { font-family:var(--font-title); font-size:18px; color:var(--gold-light); margin-bottom:0; }
    .dest-desc { font-size:14px; line-height:1.6; color:var(--text-muted); margin-bottom:4px; }
    .rank-row { display:flex; align-items:center; gap:12px; padding:16px; border-radius:12px; margin-bottom:0; background:var(--surface); border:1px solid var(--border); }
    .rank-row.eu { border-color:var(--gold); background:rgba(232,185,74,.07); }
    .rank-pos { width:30px; text-align:center; font-family:var(--font-title); font-weight:800; font-size:15px; color:var(--text-muted); flex:none; }
    .rank-info { flex:1; min-width:0; }
    .rank-nome { font-weight:700; font-size:14px; color:var(--text); white-space:normal; overflow-wrap:anywhere; line-height:1.5; }
    .rank-nivel { font-size:11px; color:var(--text-muted); }
    .rank-val { font-family:var(--font-title); font-weight:800; font-size:15px; color:var(--gold); flex:none; text-align:right; }
    .rank-val small { display:block; font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
      #dest-corpo { display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; }
    #dest-corpo > :is(.dest-head,.dest-desc,.dest-group-heading,.empty) { flex:0 0 100%; min-width:0; }

    .rank-pos { width:26px; }

    @media(max-width:1000px){.dest-tabs{grid-template-columns:repeat(3,minmax(0,1fr));}}

<script>
let ctx = null, dados = null, euId = null;
const ABAS = [
  { key:'servos',    tab:'🕯️ Servos do Altar', head:'Servos do Altar',     desc:'Quem mais serviu nas celebrações.',        unidade:'vezes',    sing:'vez' },
  { key:'versateis', tab:'🎓 Versáteis',        head:'Os mais versáteis',   desc:'Quem domina mais funções no altar.',       unidade:'funções',  sing:'função' },
  { key:'prontos',   tab:'🙋 Sempre prontos',   head:'Sempre prontos',      desc:'Quem se disponibilizou para mais missas.', unidade:'horários', sing:'horário' },
];

async function init() {
  ctx = await initModulo();
  if (!ctx) return;
  renderHeader(ctx, 'destaques');
  renderBottomNav(ctx, 'destaques');
  euId = ctx.membro ? ctx.membro.id : null;
  const { data, error } = await sb.rpc('acolitos_destaques');
  const main = document.getElementById('main-content'); main.textContent = '';
  const title = document.createElement('h1'); title.className = 'page-title'; title.textContent = 'Destaques'; main.appendChild(title);
  const hint = document.createElement('p'); hint.style.cssText = 'font-size:12px;color:var(--text-muted);margin:-6px 0 12px;line-height:1.5;'; hint.textContent = 'Um reconhecimento à dedicação de cada um. 🙏'; main.appendChild(hint);
  if (error) { const e=document.createElement('span'); e.className='empty'; e.textContent='Não foi possível carregar.'; main.appendChild(e); return; }
  dados = data || {};

  const tabs = document.createElement('div'); tabs.className = 'dest-tabs'; main.appendChild(tabs);
  const corpo = document.createElement('div'); corpo.id = 'dest-corpo'; main.appendChild(corpo);
  ABAS.forEach((a, i) => {
    const b = document.createElement('button'); b.type='button';b.setAttribute('aria-pressed',String(i===0));b.className = 'dest-tab' + (i===0?' active':''); b.textContent = a.tab;
    b.onclick = () => { tabs.querySelectorAll('.dest-tab').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');}); b.classList.add('active');b.setAttribute('aria-pressed','true'); renderAba(a); };
    tabs.appendChild(b);
  });
  [['🏆 Temporada', renderTemporada], ['🏅 Campeões', renderCampeoes], ['🙋 Solícitos', renderSolicitos]].forEach(([label, fn]) => {
    const b = document.createElement('button'); b.type='button';b.setAttribute('aria-pressed','false');b.className = 'dest-tab'; b.textContent = label;
    b.onclick = () => { tabs.querySelectorAll('.dest-tab').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');}); b.classList.add('active');b.setAttribute('aria-pressed','true'); fn(document.getElementById('dest-corpo')); };
    tabs.appendChild(b);
  });
  renderAba(ABAS[0]);
}

const LIGA_LABEL = { iniciantes:'🟢 Iniciantes', acolitos:'🔵 Acólitos', cerimoniarios:'🟣 Cerimoniários' };
function prepararLinhaRank(row,m){row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label','Ver cartão de '+m.nome);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}};}
function rankRow(m, eu, valor, unidade, pos, medalhaPos) {
  const medalhas = ['🥇','🥈','🥉'];
  const row = document.createElement('div'); row.className = 'rank-row' + (m.id===eu?' eu':''); row.style.cursor = 'pointer'; row.onclick = () => abrirCard(m.id);prepararLinhaRank(row,m);
  const p = document.createElement('div'); p.className = 'rank-pos'; p.textContent = medalhaPos ? medalhaPos : (pos<=3 ? medalhas[pos-1] : pos);
  const av = buildAvatarEl(m.foto_url, nivelInfo(m.nivel||'aspirante').base, 38, { nivelSlug: m.nivel||'aspirante', casaSlug: casaSlugDe(m) }); av.style.flex = 'none';
  const info = document.createElement('div'); info.className = 'rank-info';
  const nmRow = document.createElement('div'); nmRow.style.cssText = 'display:flex;align-items:center;gap:5px;min-width:0;';
  const nm = document.createElement('div'); nm.className = 'rank-nome'; nm.textContent = (m.id===eu?'★ ':'') + m.nome;
  nmRow.append(nm, estrelaTagAsync(m.id));
  const nv = document.createElement('div'); nv.className = 'rank-nivel'; nv.textContent = m.subnivel || nivelInfo(m.nivel||'aspirante').label;
  info.append(nmRow, nv);
  const val = document.createElement('div'); val.className = 'rank-val'; val.innerHTML = valor + '<small>' + unidade + '</small>';
  row.append(p, av, info, val); return row;
}
async function renderTemporada(corpo) {
  corpo.textContent = ''; const ld = document.createElement('div'); ld.className = 'dest-desc'; ld.textContent = 'Carregando...'; corpo.appendChild(ld);
  const { data } = await sb.rpc('acolitos_ranking_temporada');
  corpo.textContent = '';
  if (!data || !data.temporada) { const e = document.createElement('span'); e.className = 'empty'; e.textContent = 'Nenhuma temporada rolando agora. 🙂'; corpo.appendChild(e); return; }
  const h = document.createElement('div'); h.className = 'dest-head'; comIcone(h, 'trophy', '' + data.temporada.nome); corpo.appendChild(h);
  const d = document.createElement('div'); d.className = 'dest-desc'; d.textContent = 'Ranking de XP da temporada, por liga. O campeão de cada liga vira Destaque!'; corpo.appendChild(d);
  const eu = data.eu_id;
  if (!(data.ligas||[]).length) { const e = document.createElement('span'); e.className = 'empty'; e.textContent = 'Ninguém pontuou ainda. Bora servir! 🕯️'; corpo.appendChild(e); return; }
  acEstrelasLote((data.ligas||[]).flatMap(lg => (lg.membros||[]).map(m => m.id)));
  (data.ligas||[]).forEach(lg => {
    const lh = document.createElement('div');lh.className='dest-group-heading'; lh.style.cssText = 'font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--gold);margin:16px 0 6px;'; lh.textContent = LIGA_LABEL[lg.liga] || lg.liga; corpo.appendChild(lh);
    let dist = 0, last = null;
    (lg.membros||[]).forEach(m => { const v = Number(m.xp); if (v!==last) { dist++; last = v; } corpo.appendChild(rankRow(m, eu, v, 'XP', dist)); });
  });
}
async function renderCampeoes(corpo) {
  corpo.textContent = ''; const ld = document.createElement('div'); ld.className = 'dest-desc'; ld.textContent = 'Carregando...'; corpo.appendChild(ld);
  const { data } = await sb.rpc('acolitos_campeoes');
  corpo.textContent = '';
  const h = document.createElement('div'); h.className = 'dest-head'; comIcone(h, 'award', 'Campeões'); corpo.appendChild(h);
  const d = document.createElement('div'); d.className = 'dest-desc'; d.textContent = 'Os campeões de cada liga nas temporadas encerradas.'; corpo.appendChild(d);
  if (!data || !data.length) { const e = document.createElement('span'); e.className = 'empty'; e.textContent = 'Ainda não há campeões — a primeira temporada está rolando! 🏆'; corpo.appendChild(e); return; }
  acEstrelasLote(data.map(c => c.membro_id));
  const grupos = {}; data.forEach(c => { (grupos[c.temporada] = grupos[c.temporada] || []).push(c); });
  Object.keys(grupos).forEach(temp => {
    const th = document.createElement('div');th.className='dest-group-heading'; th.style.cssText = 'font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--gold);margin:16px 0 6px;'; comIcone(th, 'trophy', '' + temp); corpo.appendChild(th);
    grupos[temp].forEach(c => corpo.appendChild(rankRow({ id:c.membro_id, nome:c.membro, foto_url:c.foto_url, nivel:c.nivel, casa_id:c.casa_id, subnivel:(LIGA_LABEL[c.liga]||c.liga) }, null, c.xp, 'XP', 1, '🏅')));
  });
}

async function renderSolicitos(corpo) {
  corpo.textContent = ''; const ld = document.createElement('div'); ld.className = 'dest-desc'; ld.textContent = 'Carregando...'; corpo.appendChild(ld);
  const { data } = await sb.rpc('acolitos_solicitos');
  corpo.textContent = '';
  const h = document.createElement('div'); h.className = 'dest-head'; comIcone(h, 'mao', 'Solícitos'); corpo.appendChild(h);
  const d = document.createElement('div'); d.className = 'dest-desc'; d.textContent = 'Quem mais serviu sem estar escalado — sempre prontos a ajudar. 🙏'; corpo.appendChild(d);
  if (!data || !data.length) { const e = document.createElement('span'); e.className = 'empty'; e.textContent = 'Ninguém serviu fora de escala ainda. Bora ser solícito! 🙌'; corpo.appendChild(e); return; }
  acEstrelasLote(data.map(m => m.membro_id));
  let dist = 0, last = null;
  data.forEach(m => { const v = Number(m.total); if (v !== last) { dist++; last = v; } corpo.appendChild(rankRow({ id: m.membro_id, nome: m.membro, foto_url: m.foto_url, nivel: m.nivel }, euId, v, v === 1 ? 'vez' : 'vezes', dist)); });
}
function renderAba(a) {
  const corpo = document.getElementById('dest-corpo'); corpo.textContent = '';
  const h = document.createElement('div'); h.className = 'dest-head'; h.textContent = a.head;
  const d = document.createElement('div'); d.className = 'dest-desc'; d.textContent = a.desc;
  corpo.append(h, d);
  const lista = (dados[a.key] || []).filter(x => Number(x.total) > 0);
  if (!lista.length) { const em = document.createElement('span'); em.className = 'empty'; em.textContent = 'Ainda sem dados por aqui.'; corpo.appendChild(em); return; }
  const medalhas = ['🥇','🥈','🥉'];
  acEstrelasLote(lista.map(m => m.id));
  let distintos = 0, ultimoTotal = null; // posição por VALOR: mesmo total = mesma posição (empate)
  lista.forEach((m) => {
    const tot = Number(m.total);
    if (tot !== ultimoTotal) { distintos++; ultimoTotal = tot; }
    const posicao = distintos;
    const row = document.createElement('div'); row.className = 'rank-row' + (m.id === euId ? ' eu' : '');
    row.style.cursor = 'pointer'; row.onclick = () => abrirCard(m.id);prepararLinhaRank(row,m);
    const pos = document.createElement('div'); pos.className = 'rank-pos'; pos.textContent = posicao <= 3 ? medalhas[posicao-1] : posicao;
    const av = buildAvatarEl(m.foto_url, nivelInfo(m.nivel||'aspirante').base, 38, { nivelSlug: m.nivel||'aspirante', casaSlug: casaSlugDe(m) }); av.style.flex = 'none';
    const info = document.createElement('div'); info.className = 'rank-info';
    const nmRow = document.createElement('div'); nmRow.style.cssText = 'display:flex;align-items:center;gap:5px;min-width:0;';
    const nm = document.createElement('div'); nm.className = 'rank-nome'; nm.textContent = (m.id===euId?'★ ':'') + m.nome;
    nmRow.append(nm, estrelaTagAsync(m.id));
    const nv = document.createElement('div'); nv.className = 'rank-nivel'; nv.textContent = nivelInfo(m.nivel||'aspirante').label;
    info.append(nmRow, nv);
    const val = document.createElement('div'); val.className = 'rank-val';
    val.innerHTML = tot + '<small>' + (tot===1?a.sing:a.unidade) + '</small>';
    row.append(pos, av, info, val); corpo.appendChild(row);
  });
}

const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FUNCAO_LABEL = { cred_altar:'Cerimonial de Altar', cred_credencia:'Cerimonial de Credência', missal:'Missal', turibulo:'Turíbulo', naveta:'Naveta', altar:'Altar', cruz:'Cruz', vela:'Vela', sineta:'Sineta', sinao:'Sinão', apoio:'Apoio', mitra:'Mitra', baculo:'Báculo' };
function dataCurta(d){ const x=new Date(d+'T00:00:00'); return DIAS[x.getDay()]+' '+x.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }

let _destCardN=0;
async function abrirCard(id) {
  const origem=document.activeElement,overflowAnterior=document.body.style.overflow;
  const ov=document.createElement('div');ov.className='modal-overlay open dest-member-overlay';
  const modal=document.createElement('div');modal.className='modal dest-member-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
  const title=document.createElement('h2');title.className='dest-member-title';title.id='dest-member-title-'+(++_destCardN);title.textContent='Cartão do membro';modal.setAttribute('aria-labelledby',title.id);
  const body=document.createElement('div');body.className='dest-member-status';body.setAttribute('role','status');body.textContent='Carregando cartão…';
  let fechado=false;
  const fechar=()=>{if(fechado)return;fechado=true;ov.remove();document.body.style.overflow=overflowAnterior;if(origem?.isConnected)origem.focus({preventScroll:true});};
  ov._acResolveClose=fechar;ov.onclick=e=>{if(e.target===ov)fechar();};
  const close=document.createElement('button');close.type='button';close.className='btn-sm gray';close.textContent='Fechar';close.onclick=fechar;
  const actions=document.createElement('div');actions.className='dest-member-actions';actions.append(close);modal.append(title,body,actions);ov.append(modal);document.body.style.overflow='hidden';document.body.append(ov);close.focus({preventScroll:true});
  modal.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();fechar();}if(e.key==='Tab'){const buttons=[...modal.querySelectorAll('button:not([disabled])')];const i=buttons.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();buttons.at(-1)?.focus();}else if(!e.shiftKey&&i===buttons.length-1){e.preventDefault();buttons[0]?.focus();}}});
  let result;try{result=await sb.rpc('acolitos_membro_card',{p_id:id});}catch(e){result={error:e};}
  if(fechado)return;
  const m=result.data;if(result.error||!m){body.textContent='Não foi possível carregar o cartão. Feche e tente novamente.';return;}
  body.removeAttribute('role');body.className='dest-member-layout';body.replaceChildren();
  const profile=document.createElement('section');profile.className='dest-member-profile';
  const head=document.createElement('div');head.className='dest-member-head';
  const avatar=buildAvatarEl(m.foto_url,nivelInfo(m.nivel||'aspirante').base,84,{nivelSlug:m.nivel||'aspirante',casaSlug:casaSlugDe(m)});avatar.style.flex='none';
  const info=document.createElement('div');info.style.minWidth='0';
  const name=document.createElement('h3');name.className='dest-member-name';name.textContent=m.nome_completo||m.nome;info.append(name,estrelaTagAsync(id));
  const level=document.createElement('p');level.className='dest-member-level';const ni=nivelInfo(m.nivel||'aspirante');level.textContent=ni.label+(ni.titulo?' · '+ni.titulo:'');info.append(level);head.append(avatar,info);profile.append(head);
  const stats=document.createElement('dl');stats.className='dest-member-stats';
  [['Celebrações servidas',m.total_servido??0],['Funções que domina',m.funcoes??0],['Comunidade',({matriz:'Matriz',santo_antonio:'Sto. Antônio'})[m.comunidade]||'Não informada']].forEach(([label,value])=>{const item=document.createElement('div');item.className='dest-member-stat';const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=value;item.append(dt,dd);stats.append(item);});profile.append(stats);
  const recent=document.createElement('section');recent.className='dest-member-recent';const h=document.createElement('h3');h.textContent='Últimas missas';recent.append(h);
  const ult=m.ultimas||[];
  if(!ult.length){const empty=document.createElement('p');empty.className='dest-member-level';empty.textContent='Ainda não foi escalado em nenhuma missa.';recent.append(empty);}
  for(const u of ult){const row=document.createElement('div');row.className='dest-member-mass';const dt=document.createElement('time');dt.dateTime=u.data;dt.textContent=dataCurta(u.data)+' · '+u.horario;const fn=document.createElement('span');fn.textContent=FUNCAO_LABEL[u.funcao]||u.funcao;row.append(dt,fn);recent.append(row);}
  body.append(profile,recent);
}

init();
</script>
</body>
