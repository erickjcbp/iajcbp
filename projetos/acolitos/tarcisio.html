<head>

<body>
<div id="app-header"></div>
<div id="app-nav"></div>
<div class="main" id="main-content">
  <span class="loading">Carregando...</span>
</div>
<script src="navegacao-core.js"></script>
<script src="portao-notificacoes-core.js"></script>
<script src="boas-vindas-core.js"></script>
<script src="foto-recado-core.js"></script>
<script src="horario-core.js"></script>
<script src="filtro-lista-core.js"></script>
<script src="senha-nova-core.js"></script>
<script src="telefones-core.js"></script>
<script src="paginar-core.js"></script>
<script src="acesso-core.js"></script>
<script src="rodizio-core.js"></script>
<script src="identidade-core.js"></script>
<script src="shared.js"></script>
<script src="tarcisio-painel.js"></script>
<script>
// São Tarcísio | JCBP — o dia a dia da coordenação: avisos e quem está sem número.
// WhatsApp, grupos, assistente de IA e conversas ficam em Configurações (superadmin).
let ctx = null, aba = 'avisos';
const ABAS = [['avisos', 'Avisos', () => TarcisioPainel.avisos], ['sem', 'Sem número', () => TarcisioPainel.semNumero]];

function semAcesso() {
  const main = document.getElementById('main-content'); main.textContent = '';
  const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Esta tela é só do admin e do subadmin da coordenação.';
  main.appendChild(p);
}

async function desenhar() {
  const main = document.getElementById('main-content'); main.textContent = '';
  const t = document.createElement('h1'); t.className = 'page-title'; t.textContent = 'São Tarcísio | JCBP'; main.appendChild(t);
  const p = document.createElement('p'); p.className = 'tc-st-muted';
  p.textContent = 'Avisos que o WhatsApp da pastoral envia nos grupos e no privado.' + (isSuperadmin(ctx) ? ' Conexão, grupos e assistente de IA ficam em Configurações.' : '');
  main.appendChild(p);
  const tg = document.createElement('div'); tg.className = 'tc-aba-toggle'; tg.setAttribute('role', 'tablist');
  ABAS.forEach(([k, rot]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tc-aba-btn' + (k === aba ? ' tc-ativa' : '');
    b.setAttribute('role', 'tab'); b.textContent = rot;
    b.onclick = () => { aba = k; try { localStorage.setItem('tarcisio-aba', k); } catch (_) {} desenhar(); };
    tg.appendChild(b);
  });
  main.appendChild(tg);
  const box = document.createElement('div'); main.appendChild(box);
  await ABAS.find((x) => x[0] === aba)[2]()(box);
}

async function init() {
  ctx = await initModulo();
  if (!ctx) return;
  renderHeader(ctx, 'escala');
  renderBottomNav(ctx, 'escala');
  if (!navCaps(ctx).isAdmin) { semAcesso(); return; }
  try { const s = localStorage.getItem('tarcisio-aba'); if (ABAS.some((x) => x[0] === s)) aba = s; } catch (_) {}
  await desenhar();
}
init();
</script>
</body>
</html>
