    .cq-lock { position:absolute; top:6px; right:8px; font-size:12px; opacity:.6; }
    .cq-trofeus { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-bottom:8px; }
    .cq-trofeu { display:flex; align-items:center; gap:18px; padding:18px; border-radius:10px; min-width:0; background:linear-gradient(165deg,rgba(232,185,74,.1),var(--surface)); border:1px solid var(--gold-dim); }
    .cq-tro-ico { flex:none; width:112px; height:136px; display:grid; place-items:center; }
    .cq-tro-ico > :is(img,svg) { width:100%; height:100%; object-fit:contain; }
    .cq-tro-info { flex:1; min-width:0; }
    .cq-tro-tit { font-family:var(--font-body); font-weight:700; font-size:16px; line-height:1.4; color:var(--gold-light); }
    .cq-tro-sub { font-size:13px; line-height:1.6; color:var(--text-muted); margin-top:8px; }

    .cq-medal-status.ganha { color:var(--success-text); }

    @media(max-width:639px){

      .cq-medal-desc { font-size:14px; line-height:1.6; margin-bottom:18px; }
      .cq-medal-requisito { text-align:left; padding:14px; }
      .cq-medal-fechar { width:100%; }
      .cq-toolbar { grid-template-columns:minmax(0,1fr); gap:12px; }
      .cq-filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }

    hostia:  `<g><g stroke="#e8b94a" stroke-width="2" stroke-linecap="round"><line x1="32" y1="19" x2="32" y2="16"/><line x1="39.4" y1="22.6" x2="41.5" y2="20.5"/><line x1="24.6" y1="22.6" x2="22.5" y2="20.5"/><line x1="42.5" y1="30" x2="45.5" y2="30"/><line x1="21.5" y1="30" x2="18.5" y2="30"/></g><rect x="30" y="39" width="4" height="5" fill="#c8941f"/><rect x="26" y="44" width="12" height="3.2" rx="1.5" fill="#e8b94a" stroke="#c8941f" stroke-width=".8"/><circle cx="32" cy="30" r="9" fill="#e8b94a" stroke="#c8941f" stroke-width="1.3"/><circle cx="32" cy="30" r="5.8" fill="#fff6e2" stroke="#e2cda0" stroke-width="1"/><line x1="32" y1="26.6" x2="32" y2="33.4" stroke="#c8941f" stroke-width="1.4"/><line x1="28.6" y1="30" x2="35.4" y2="30" stroke="#c8941f" stroke-width="1.4"/></g>`,
    crucifixo:`<g stroke="${acc}" stroke-linecap="round" fill="none"><g stroke-width="2.8"><line x1="32" y1="22" x2="32" y2="47"/><line x1="23" y1="30" x2="41" y2="30"/></g><line x1="29" y1="22" x2="35" y2="22" stroke-width="2"/></g>`,
  };
  const S = 0.66, tx = (cx - 32 * S).toFixed(1), ty = (cy - 31 * S).toFixed(1);
  const sym = SIMB[simbolo] || SIMB.estrela;
  const png = PNG[simbolo];
  const emblema = png
    ? '<image href="/midia/elementos/' + png.replace(/ /g, '%20') + '" x="' + (cx - 13) + '" y="' + (cy - 13) + '" width="26" height="26" preserveAspectRatio="xMidYMid meet"/>'
    : '<g transform="translate(' + tx + ' ' + ty + ') scale(' + S + ')">' + sym + '</g>';
  const np = 16; let burst = '';
  for (let i = 0; i < np * 2; i++) { const a = Math.PI * i / np - Math.PI / 2, r = (i % 2) ? 20.5 : 27; burst += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1) + ' '; }
  burst += 'Z';
  let beads = ''; const nb = 20;
  for (let i = 0; i < nb; i++) { const a = 2 * Math.PI * i / nb; beads += '<circle cx="' + (cx + 18 * Math.cos(a)).toFixed(1) + '" cy="' + (cy + 18 * Math.sin(a)).toFixed(1) + '" r="0.85" fill="' + c.hi + '"/>'; }
  return '<svg viewBox="0 0 72 88" width="' + size + '" height="' + (size * 88 / 72).toFixed(0) + '" fill="none" xmlns="http://www.w3.org/2000/svg">'
    + '<defs><radialGradient id="' + id + '" cx="0.5" cy="0.34" r="0.7"><stop offset="0" stop-color="' + c.hi + '"/><stop offset="0.55" stop-color="' + c.mid + '"/><stop offset="1" stop-color="' + c.lo + '"/></radialGradient></defs>'
    + '<path d="M29 58 L22 86 L32 78 L36 62 Z" fill="' + c.ribbon + '"/>'
    + '<path d="M43 58 L50 86 L40 78 L36 62 Z" fill="' + c.ribbonD + '"/>'
    + '<path d="' + burst + '" fill="' + c.mid + '" opacity="0.5"/>'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="22" fill="url(#' + id + ')" stroke="' + c.ring + '" stroke-width="1.3"/>'
    + beads
    + '<circle cx="' + cx + '" cy="' + cy + '" r="15" fill="' + c.disc + '"/>'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="15" fill="none" stroke="' + c.ring + '" stroke-width="0.9" opacity="0.5"/>'
    + emblema
    + '<ellipse cx="29" cy="29" rx="9" ry="4.5" fill="#ffffff" opacity="0.3" transform="rotate(-35 29 29)"/>'
    + '</svg>';
}

async function init() {
  ctx = await initModulo();
  if (!ctx) return;
  renderHeader(ctx, 'conquistas');
  renderBottomNav(ctx, 'conquistas');
  const main = document.getElementById('main-content'); main.textContent = '';
  const title = document.createElement('h1'); title.className = 'page-title'; title.textContent = 'Conquistas'; main.appendChild(title);
  const hint = document.createElement('p'); hint.style.cssText = 'font-size:12px;color:var(--text-muted);margin:-6px 0 8px;line-height:1.5;'; hint.textContent = 'Sua coleção de insígnias e troféus na jornada do altar. 🏅'; main.appendChild(hint);

  const nivel = (ctx.membro && ctx.membro.nivel) || 'aspirante';
  const meuIdx = Math.max(0, nivelIndex(nivel));

  // troféus de temporada (campeões) + medalhas de marcos
  let campeoes = [], badges = [];
  if (ctx.membro) {
    try { const { data } = await sb.rpc('acolitos_campeoes'); campeoes = (data || []).filter(c => c.membro_id === ctx.membro.id); } catch (e) {}
    try { await sb.rpc('acolitos_badges_registrar', { p_membro: ctx.membro.id }); } catch (e) {}
    try { const { data } = await sb.rpc('acolitos_badges_membro', { p_membro: ctx.membro.id }); badges = data || []; } catch (e) {}
  }
  const medGanhas = badges.filter(b => b.ganho).length;

  // resumo
  const resumo = document.createElement('div'); resumo.className = 'cq-resumo';
  [[(meuIdx + 1) + '/' + NIVEIS.length, 'Insígnias'], [medGanhas + '/' + badges.length, 'Medalhas'], [String(campeoes.length), 'Troféus']].forEach(([v, l]) => {
    const c = document.createElement('div'); c.className = 'cq-stat'; c.innerHTML = '<b>' + v + '</b><span>' + l + '</span>'; resumo.appendChild(c);
  });
  main.appendChild(resumo);

  // Insígnias de nível
  const s1 = document.createElement('div'); s1.className = 'cq-sec'; comIcone(s1, 'award', 'Insígnias de Nível'); main.appendChild(s1);
  const d1 = document.createElement('div'); d1.className = 'cq-desc'; d1.textContent = 'Cada nível conquistado é uma insígnia sua. As próximas estão te esperando.'; main.appendChild(d1);
  const grid = document.createElement('div'); grid.className = 'cq-grid'; main.appendChild(grid);
  NIVEIS.forEach((n, i) => {
    const ganha = i <= meuIdx;
    const cell = document.createElement('div'); cell.className = 'cq-ins' + (ganha ? ' ganha' : ' locked');
    const patch = document.createElement('div'); patch.className = 'cq-patch'; patch.appendChild(buildRankEmblem(n.slug, innerWidth < 640 ? 46 : 64));
    const nome = document.createElement('div'); nome.className = 'cq-nome'; nome.textContent = n.label;
    cell.append(patch, nome);
    if (!ganha) { const lk = document.createElement('div'); lk.className = 'cq-lock'; comIcone(lk, 'lock', '', 'Bloqueado'); cell.appendChild(lk); }
    grid.appendChild(cell);
  });

  // Troféus de temporada
  const s2 = document.createElement('div'); s2.className = 'cq-sec'; comIcone(s2, 'trophy', 'Troféus de Temporada'); main.appendChild(s2);
  const d2 = document.createElement('div'); d2.className = 'cq-desc'; d2.textContent = 'Cada vez que você fecha uma temporada como campeão da sua liga, ganha um troféu.'; main.appendChild(d2);
  if (!campeoes.length) {
    const e = document.createElement('div'); e.className = 'cq-sem-trofeu';
    const ico = document.createElement('div'); ico.className = 'cq-tro-ico'; ico.innerHTML = trofeuArte('iniciantes', 80);
    const texto = document.createElement('span'); texto.textContent = 'Seu primeiro troféu está por vir. Vença uma temporada da sua liga para conquistar.';
    e.append(ico, texto); main.appendChild(e);
  } else {
    const trofeus = document.createElement('div'); trofeus.className = 'cq-trofeus'; main.appendChild(trofeus);
    campeoes.forEach(c => {
      const row = document.createElement('div'); row.className = 'cq-trofeu';
      const ico = document.createElement('div'); ico.className = 'cq-tro-ico'; ico.innerHTML = trofeuArte(c.liga, 112);
      const info = document.createElement('div'); info.className = 'cq-tro-info';
      const t = document.createElement('div'); t.className = 'cq-tro-tit'; t.textContent = 'Campeão · ' + (LIGA_LABEL[c.liga] || c.liga);
      const sub = document.createElement('div'); sub.className = 'cq-tro-sub'; sub.textContent = 'Temporada ' + c.temporada + ' · ' + c.xp + ' XP';
      info.append(t, sub); row.append(ico, info); trofeus.appendChild(row);
    });
  }

  // Medalhas de marcos
  const s3 = document.createElement('div'); s3.className = 'cq-sec'; comIcone(s3, 'award', 'Medalhas'); main.appendChild(s3);
  const d3 = document.createElement('div'); d3.className = 'cq-desc'; d3.textContent = 'Explore sua coleção ou veja os requisitos das medalhas que ainda pode conquistar.'; main.appendChild(d3);
  if (!badges.length) { const e = document.createElement('span'); e.className = 'empty'; e.textContent = 'Sem medalhas por aqui ainda.'; main.appendChild(e); }
  else {
    montarColecaoMedalhas(main, badges);
  }
}

function montarColecaoMedalhas(main, badges) {
  const toolbar = document.createElement('div'); toolbar.className = 'cq-toolbar';
  const busca = document.createElement('div'); busca.className = 'cq-search';
  const label = document.createElement('label'); label.htmlFor = 'cq-medal-busca'; label.textContent = 'Buscar medalha';
  const campo = document.createElement('div'); campo.className = 'cq-search-field';
  const input = document.createElement('input'); input.type = 'search'; input.id = 'cq-medal-busca'; input.placeholder = 'Nome ou requisito'; input.setAttribute('aria-controls', 'cq-medalhas');
  const limpar = document.createElement('button'); limpar.type = 'button'; limpar.className = 'cq-clear'; limpar.textContent = 'Limpar'; limpar.setAttribute('aria-label', 'Limpar busca de medalhas');
  campo.append(input, limpar); busca.append(label, campo);
  const filtros = document.createElement('div'); filtros.className = 'cq-filters'; filtros.setAttribute('role', 'group'); filtros.setAttribute('aria-label', 'Filtrar medalhas');
  const contagens = { todas:badges.length, conquistadas:badges.filter(b => b.ganho).length, pendentes:badges.filter(b => !b.ganho).length };
  let filtro = 'todas';
  const botoes = [];
  [['todas', 'Todas'], ['conquistadas', 'Conquistadas'], ['pendentes', 'Para conquistar']].forEach(([valor, texto]) => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'cq-filter'; btn.dataset.filtro = valor; btn.textContent = texto + ' (' + contagens[valor] + ')'; btn.setAttribute('aria-pressed', String(valor === filtro)); btn.setAttribute('aria-controls', 'cq-medalhas');
    btn.onclick = () => { filtro = valor; atualizar(); }; botoes.push(btn); filtros.appendChild(btn);
  });
  const ordem = document.createElement('div'); ordem.className = 'cq-sort';
  const ordemLabel = document.createElement('label'); ordemLabel.htmlFor = 'cq-medal-ordem'; ordemLabel.textContent = 'Ordenar por';
  const ordemSel = document.createElement('select'); ordemSel.id = 'cq-medal-ordem'; ordemSel.setAttribute('aria-controls', 'cq-medalhas');
  [['padrao', 'Padrão (por nível)'], ['recentes', 'Mais recentes'], ['az', 'A a Z']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; ordemSel.appendChild(o); });
  ordem.append(ordemLabel, ordemSel);
  toolbar.append(busca, filtros, ordem);
  const resultado = document.createElement('p'); resultado.className = 'cq-results'; resultado.setAttribute('role', 'status'); resultado.setAttribute('aria-live', 'polite');
  const mg = document.createElement('div'); mg.className = 'cq-grid cq-medal-grid'; mg.id = 'cq-medalhas';
  const normalizar = texto => String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
  const cartoes = badges.map((b, i) => {
      const cell = document.createElement('button'); cell.type = 'button'; cell.className = 'cq-ins cq-medal' + (b.ganho ? ' ganha' : ' locked');
      cell.setAttribute('aria-label', b.label + (b.ganho ? ' — Conquistada' : ' — Ainda não conquistada'));
      cell.onclick = () => abrirMedalha(b);
      const ico = document.createElement('div'); ico.className = 'cq-patch'; ico.innerHTML = medalSvg(b.icone, b.tier || tierDe(b.nivel), 96);
      const nome = document.createElement('div'); nome.className = 'cq-nome'; nome.textContent = b.label;
      cell.append(ico, nome);
      const requisito = document.createElement('span'); requisito.className = 'cq-card-requisito'; requisito.id = 'cq-card-requisito-' + i; cell.setAttribute('aria-describedby', requisito.id);
      const reqLabel = document.createElement('strong'); reqLabel.textContent = 'Como ganhar';
      requisito.append(reqLabel, document.createTextNode(b.requisito || 'Abra para ver os detalhes desta medalha.')); cell.appendChild(requisito);
      if (!b.ganho) { const lk = document.createElement('div'); lk.className = 'cq-lock'; comIcone(lk, 'lock', '', 'Bloqueado'); cell.appendChild(lk); }
      mg.appendChild(cell);
      return { badge:b, cell, pos:i, texto:normalizar([b.label, b.requisito, b.desc].join(' ')) };
  });
  const vazio = document.createElement('div'); vazio.className = 'cq-no-results'; vazio.hidden = true;
  const aviso = document.createElement('p'); aviso.textContent = 'Nenhuma medalha corresponde a este filtro e busca.';
  const todas = document.createElement('button'); todas.type = 'button'; todas.className = 'cq-clear'; todas.textContent = 'Ver todas as medalhas'; todas.onclick = () => { input.value = ''; filtro = 'todas'; atualizar(); input.focus(); };
  vazio.append(aviso, todas); main.append(toolbar, resultado, mg, vazio);
  function atualizar() {
    const termos = normalizar(input.value).trim().split(/\s+/).filter(Boolean);
    let visiveis = 0;
    const modo = ordemSel.value;
    const tempo = b => b.ganho_em ? Date.parse(b.ganho_em) : NaN;
    const ordenados = cartoes.slice().sort((x, y) => {
      if (modo === 'az') return x.badge.label.localeCompare(y.badge.label, 'pt-BR');
      if (modo !== 'recentes') return x.pos - y.pos;
      const gx = x.badge.ganho ? (isNaN(tempo(x.badge)) ? 1 : 0) : 2, gy = y.badge.ganho ? (isNaN(tempo(y.badge)) ? 1 : 0) : 2;
      return gx - gy || (gx === 0 ? tempo(y.badge) - tempo(x.badge) : 0) || x.pos - y.pos;
    });
    ordenados.forEach(c => mg.appendChild(c.cell));
    cartoes.forEach(({badge, cell, texto}) => {
      const status = filtro === 'todas' || (filtro === 'conquistadas' ? badge.ganho : !badge.ganho);
      cell.hidden = !(status && termos.every(termo => texto.includes(termo)));
      if (!cell.hidden) visiveis++;
    });
    botoes.forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.filtro === filtro)));
    mg.classList.toggle('show-requisitos', filtro === 'pendentes');
    vazio.hidden = visiveis > 0;
    const nome = visiveis === 1 ? 'medalha' : 'medalhas';
    const semData = modo === 'recentes' ? cartoes.filter(c => !c.cell.hidden && c.badge.ganho && isNaN(tempo(c.badge))).length : 0;
    resultado.textContent = visiveis + ' ' + nome + (filtro === 'pendentes' ? ' para conquistar. Veja como ganhar cada uma.' : filtro === 'conquistadas' ? ' conquistadas.' : ' na coleção.') + (termos.length ? ' Resultado da busca.' : '') + (semData ? ' ' + semData + ' conquistada' + (semData === 1 ? '' : 's') + ' sem data registrada ' + (semData === 1 ? 'aparece' : 'aparecem') + ' depois das datadas.' : '');
  }
  input.addEventListener('input', atualizar);
  ordemSel.addEventListener('change', atualizar);
  limpar.onclick = () => { input.value = ''; atualizar(); input.focus(); };
  atualizar();
}
let _cqDialogN = 0;
function abrirMedalha(b) {
  const origem = document.activeElement;
  const fechar = () => { ov.remove(); if (origem && origem.isConnected) origem.focus({ preventScroll:true }); };
  const ov = document.createElement('div'); ov.className = 'modal-overlay open cq-medal-overlay'; ov._acResolveClose = fechar; ov.onclick = (e) => { if (e.target === ov) fechar(); };
  const md = document.createElement('div'); md.className = 'modal cq-medal-modal'; md.setAttribute('role', 'dialog'); md.setAttribute('aria-modal', 'true');
  const corpo = document.createElement('div'); corpo.className = 'cq-medal-content';
  const ico = document.createElement('div'); ico.className = 'cq-medal-visual' + (b.ganho ? '' : ' locked'); ico.innerHTML = medalSvg(b.icone, b.tier || tierDe(b.nivel), 240);
  const info = document.createElement('div'); info.className = 'cq-medal-info';
  const nm = document.createElement('h2'); nm.id = 'cq-medal-title-' + (++_cqDialogN); nm.className = 'cq-medal-title'; nm.textContent = b.label; md.setAttribute('aria-labelledby', nm.id);
  const st = document.createElement('p'); st.className = 'cq-medal-status' + (b.ganho ? ' ganha' : ''); st.textContent = b.ganho ? '✓ Conquistada' + (b.ganho_em ? ' em ' + new Date(b.ganho_em).toLocaleDateString('pt-BR', { timeZone:'America/Sao_Paulo' }) : '') : '🔒 Ainda não conquistada';
  const desc = document.createElement('p'); desc.id = 'cq-medal-desc-' + _cqDialogN; desc.className = 'cq-medal-desc'; desc.textContent = b.desc || ''; md.setAttribute('aria-describedby', desc.id);
  const requisito = document.createElement('div'); requisito.className = 'cq-medal-requisito';
  const reqL = document.createElement('strong'); reqL.textContent = 'Como ganhar';
  const req = document.createElement('p'); req.textContent = b.requisito || '';
  requisito.append(reqL, req); info.append(nm, st, desc, requisito); corpo.append(ico, info);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn gold cq-medal-fechar'; btn.textContent = 'Fechar'; btn.onclick = fechar;
  md.append(corpo, btn); ov.appendChild(md); document.body.appendChild(ov);
  md.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const botoes = md.querySelectorAll('button:not([disabled])');
    const primeiro = botoes[0], ultimo = botoes[botoes.length - 1];
    if (e.shiftKey && document.activeElement === primeiro) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primeiro.focus(); }
  });
  btn.focus({ preventScroll:true });
}
init();
