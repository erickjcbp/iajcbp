<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;});</script>
  <style>
    /* menu lateral esquerdo (seções) + conteúdo à direita */
    .cfg-wrap { display:flex; gap:14px; align-items:flex-start; }
    .cfg-side { flex:0 0 174px; display:flex; flex-direction:column; gap:6px; position:sticky; top:8px; }
    .cfg-item { position:relative; text-align:left; padding:11px 12px 11px 15px; background:linear-gradient(165deg, var(--surface2), var(--surface)); border:1px solid var(--border-wine); color:var(--text-muted); font-family:'Sora',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.4px; cursor:pointer; line-height:1.2; clip-path:polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); transition:border-color .15s, color .15s, box-shadow .15s; }
    .cfg-item::before { content:''; position:absolute; left:0; top:3px; bottom:3px; width:3px; background:transparent; }
    .cfg-item:hover { border-color:var(--gold-dim); color:var(--text); }
    .cfg-item.on { color:var(--gold-light); border-color:var(--gold); background:linear-gradient(165deg, rgba(232,185,74,.16), var(--surface)); box-shadow:0 0 14px var(--red-glow), inset 0 0 0 1px rgba(232,185,74,.12); }
    .cfg-item.on::before { background:linear-gradient(180deg, var(--gold), var(--red-soft)); box-shadow:0 0 8px var(--red-glow); }
    .cfg-body { flex:1; min-width:0; }
    .cfg-voltar { display:none; align-items:center; gap:6px; background:none; border:0; color:var(--gold-light); font-family:'Sora',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.4px; cursor:pointer; padding:0 0 10px; }
    /* Celular: o menu deixa de dividir a largura com o conteúdo. Vira a primeira tela — lista de
       seções em largura inteira — e a seção escolhida abre sozinha, com um voltar. Antes a coluna
       comia ~40% de uma tela de 390px, quebrava os rótulos em duas linhas e ainda espremia o
       conteúdo, que estourava pela direita. */
    @media(max-width:560px){
      .cfg-wrap { flex-direction:column; gap:0; }
      .cfg-side { flex:1 1 auto; width:100%; position:static; }
      .cfg-item { font-size:13px; padding:13px 30px 13px 15px; }
      .cfg-item::after { content:'\203A'; position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--gold-dim); font-size:16px; }
      .cfg-body { width:100%; }
      .cfg-voltar { display:inline-flex; }
    }
    /* sub-abas dentro de uma seção (continuam horizontais) */
    .cfg-nav { display:flex; gap:6px; overflow-x:auto; margin:-2px 0 12px; -webkit-overflow-scrolling:touch; }
    .cfg-nav::-webkit-scrollbar { display:none; }
    .cfg-tab { padding:7px 12px; border-radius:20px; border:1px solid var(--border-wine); background:var(--surface2); color:var(--text-muted); font-family:'Sora',sans-serif; font-weight:700; font-size:12px; white-space:nowrap; cursor:pointer; }
    .cfg-tab.on { background:linear-gradient(165deg,rgba(232,185,74,.18),var(--surface)); color:var(--gold-light); border-color:var(--gold-dim); }
    /* cards ricos (Níveis, CRM, etc.) — visual Hextech */
    .cfg-card { position:relative; background:linear-gradient(165deg, var(--surface2), var(--surface)); border:1px solid var(--border-wine); border-radius:10px; padding:12px; margin-bottom:10px; clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); }
    .cfg-card-hd { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .cfg-card-hd .nmwrap { flex:1; min-width:0; }
    .cfg-card-hd .stp { font-size:10px; font-weight:700; color:var(--gold-dim); text-transform:uppercase; letter-spacing:1px; }
    .cfg-patch { width:48px; height:54px; flex:none; line-height:0; filter:drop-shadow(0 0 6px var(--red-glow)); }
    .cfg-fld { margin-top:8px; }
    .cfg-fld > label { display:block; font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
    .cfg-mini { width:30px; height:30px; flex:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border-wine); background:var(--surface2); color:var(--gold); border-radius:7px; cursor:pointer; font-size:14px; font-weight:700; }
    .cfg-mini:hover:not(:disabled) { border-color:var(--gold); box-shadow:0 0 10px var(--red-glow); }
    .cfg-mini:disabled { opacity:.25; cursor:default; }
    .cfg-mini.danger { color:var(--danger-text); }
  </style>

<body>
<div id="app-header"></div>
<div id="app-nav"></div>
<div class="main" id="main-content"><span class="loading">Carregando...</span></div>

<script src="navegacao-core.js"></script>
<script src="portao-notificacoes-core.js"></script>
<script src="boas-vindas-core.js"></script>
<script src="times-core.js"></script>
<script src="kits-core.js"></script>
<script src="gerador-substituto.js"></script>
<script src="shared.js"></script>
<script>
// A seção inicial PRECISA existir em SECOES — senão o painel abre numa tela
// que não tem botão no menu e, ao sair dela, não há como voltar sem recarregar.
// No celular a tela abre SEM seção escolhida: a lista de seções é a primeira tela, e a seção
// abre por cima dela. No computador há sempre uma aberta, porque o menu fica ao lado.
let ctx = null, secaoAtual = null;
function noCelular(){ try { return window.matchMedia('(max-width: 560px)').matches; } catch(e){ return false; } }
// As seções em quatro grupos. Antes eram 13 botões soltos, sem nenhuma pista do que era o quê.
//
// O grupo "Os módulos" tinha UM item (Etapas do CRM), enquanto oito coisas de módulo — os tipos
// de evento da Agenda, as categorias da Tesouraria, os motivos de ausência… — moravam numa seção
// chamada "Listas", debaixo de "A paróquia". Estavam juntas porque compartilham o mesmo editor,
// não porque tenham a ver umas com as outras: detalhe de construção virando navegação. Quem
// procurava "motivo de ausência" não tinha por que olhar em "A paróquia › Listas".
//
// Agora cada coisa mora no módulo a que serve, e a seção "Listas" deixou de existir.
const GRUPOS = [
  ['A paróquia',         [['identidade','Identidade'], ['comunidades','Comunidades & horários']]],
  // "Equipe & Permissões" e "Times" eram DUAS seções que se pisavam: pôr alguém num time
  // dava para fazer nas duas (e ainda no organograma das Casas). Viraram uma só, com duas
  // abas — mesma mecânica da seção Escala, que já tem três.
  ['As pessoas',         [['pessoas','Pessoas & Times'], ['admins','Admins & superadmin'], ['logins','Logins (usuário/senha)'], ['barrados','Cadastros barrados'], ['atividade','Atividade & notificações'], ['cadastro','Campos do cadastro']]],
  ['Os módulos',         [['escala','Escala'], ['agenda','Agenda'], ['tesouraria','Tesouraria'], ['ausencias','Ausências'], ['jornada','Jornada'], ['crm','CRM']]],
  ['Como o app funciona',[['navegacao','Navegação'], ['gerador','Regras do gerador'], ['missoes','Missões & XP']]],
];

// O que cada seção tem DENTRO. Um item só entra direto no editor; mais de um ganha sub-abas,
// sozinho. Antes essa fila de abas vivia cravada dentro do renderListaUnica e só servia às
// oito listas — agora é o mesmo mecanismo para qualquer seção.
//
// `lista:` desenha o editor daquela lista (o mesmo de sempre, escolhendo o tipo);
// `fn:` chama um editor próprio. As funções são declaradas mais abaixo no arquivo e podem ser
// citadas aqui porque declaração de função sobe — ao contrário de `const`, que não sobe (é por
// isso que LISTAS_CFG guarda `padroes` como função em vez de lista pronta).
const CONTEUDO = {
  identidade:  [{ nome:'Identidade',           fn:renderIdentidade }],
  comunidades: [{ nome:'Comunidades',          fn:renderComunidades }],
  pessoas:     [{ nome:'Pessoas',              fn:renderEquipe },
                { nome:'Times',                fn:renderTimes }],
  admins:      [{ nome:'Admins & superadmin',  fn:renderAdmins }],
  logins:      [{ nome:'Logins',               fn:renderLogins }],
  barrados:    [{ nome:'Cadastros barrados',   fn:renderBarrados }],
  atividade:   [{ nome:'Atividade',            fn:renderAtividade }],
  cadastro:    [{ nome:'Campos do cadastro',   fn:renderCadastro }],
  escala:      [{ nome:'Funções litúrgicas',   lista:'funcao' },
                { nome:'Tipos de celebração',  lista:'tipo_celebracao' },
                { nome:'Modelos de escala',    fn:renderModelos }],
  agenda:      [{ nome:'Tipos de evento',      lista:'tipo_evento' }],
  tesouraria:  [{ nome:'Entradas',             lista:'cat_entrada' },
                { nome:'Saídas',               lista:'cat_saida' }],
  ausencias:   [{ nome:'Motivos de ausência',  lista:'motivo' }],
  jornada:     [{ nome:'Competências',         lista:'competencia' },
                { nome:'Habilidades',          lista:'habilidade' },
                { nome:'Níveis',               fn:renderNiveis }],
  crm:         [{ nome:'Etapas do CRM',        fn:renderCrm }],
  navegacao:   [{ nome:'Navegação',            fn:renderNavOrdem }],
  gerador:     [{ nome:'Regras do gerador',    fn:renderGerador }],
  missoes:     [{ nome:'Missões & XP',         fn:renderMissoes }],
};
// Qual sub-aba está aberta em cada seção — lembrada enquanto a tela não recarrega, para quem
// vai e volta entre Entradas e Saídas não recomeçar do começo toda vez.
const SUB_ABERTA = {};
const SECOES = GRUPOS.flatMap(([,itens]) => itens);
async function init(){
  ctx = await initModulo();
  if (!ctx) return;
  if (!isSuperadmin(ctx)) { window.location.href = 'index.html'; return; }
  renderHeader(ctx, 'config'); renderBottomNav(ctx, 'config');
  if (!noCelular()) secaoAtual = 'identidade';
  render();

  // Girar o aparelho ou abrir no computador não pode deixar a tela em branco: no celular sem
  // seção escolhida mostra-se a lista; no computador tem de haver sempre uma aberta.
  try {
    window.matchMedia('(max-width: 560px)').addEventListener('change', () => {
      if (!noCelular() && !secaoAtual) secaoAtual = 'identidade';
      render();
    });
  } catch (e) {}

  // Voltar do aparelho volta para a lista. Convive com o que fecha modais (shared.js): aquele
  // só age quando há modal aberto, e este só quando o estado do histórico deixou de ser o meu —
  // então Voltar com um modal aberto fecha o modal e CONTINUA na seção, como deve.
  window.addEventListener('popstate', () => {
    if (!noCelular()) return;
    const st = history.state;
    if (!st || !st.cfgSecao) { if (secaoAtual) { secaoAtual = null; render(); } }
  });
}

// Abrir uma seção no celular é uma ida: entra no histórico para o Voltar desfazer.
function abrirSecao(id){
  secaoAtual = id;
  if (noCelular()) { try { history.pushState({ cfgSecao:id }, ''); } catch(e){} }
  render();
}
function render(){
  const main = document.getElementById('main-content'); main.textContent='';
  const t = document.createElement('h1'); t.className='page-title'; t.textContent='Configuração'; main.appendChild(t);
  const wrap = document.createElement('div'); wrap.className='cfg-wrap';
  // No celular só UMA das duas metades existe de cada vez: a lista OU a seção aberta. No
  // computador as duas, lado a lado, como sempre.
  const soLista  = noCelular() && !secaoAtual;
  const soSecao  = noCelular() && !!secaoAtual;

  if (!soSecao) {
    const side = document.createElement('div'); side.className='cfg-side';
    GRUPOS.forEach(([titulo,itens])=>{
      const h=document.createElement('div');
      h.style.cssText='font-family:Sora,sans-serif;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);margin:14px 0 5px;padding-left:2px;';
      h.textContent=titulo; side.appendChild(h);
      itens.forEach(([id,label])=>{ const b=document.createElement('button'); b.className='cfg-item'+(id===secaoAtual?' on':''); b.textContent=label; b.onclick=()=>abrirSecao(id); side.appendChild(b); });
    });
    wrap.appendChild(side);
  }

  const body = document.createElement('div'); body.id='cfg-body'; body.className='cfg-body';
  if (!soLista) {
    if (soSecao) {
      // O voltar é `history.back()`, não um `secaoAtual=null` na mão: assim o botão da tela e o
      // Voltar do aparelho passam pelo MESMO caminho e o histórico não acumula ida sem volta.
      const volta = document.createElement('button'); volta.className='cfg-voltar';
      volta.textContent='‹ Configuração';
      volta.onclick = () => { try { history.back(); } catch(e){ secaoAtual=null; render(); } };
      body.appendChild(volta);
      const tit = document.createElement('div');
      tit.style.cssText='font-family:Sora,sans-serif;font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);margin:0 0 10px;';
      tit.textContent = (SECOES.find(([id]) => id === secaoAtual) || [,''])[1];
      body.appendChild(tit);
    }
    wrap.appendChild(body);
  }
  main.appendChild(wrap);
  if (!soLista) desenharSecao(body);
}

// Desenha a seção aberta. Uma coisa dentro: entra direto. Mais de uma: sub-abas primeiro.
function desenharSecao(body) {
  const itens = CONTEUDO[secaoAtual] || [];
  if (!itens.length) return;
  let i = SUB_ABERTA[secaoAtual] || 0;
  if (i >= itens.length) i = 0;   // seção que encolheu não pode deixar a tela em branco

  if (itens.length > 1) {
    const nav = document.createElement('div'); nav.className='cfg-nav';
    itens.forEach((it, n) => {
      const x = document.createElement('button'); x.className = 'cfg-tab' + (n === i ? ' on' : '');
      x.textContent = it.nome;
      x.onclick = () => { SUB_ABERTA[secaoAtual] = n; render(); };
      nav.appendChild(x);
    });
    body.appendChild(nav);
  }
  // Alvo próprio: o editor limpa o que recebe, e sem isto ele apagaria as sub-abas ao redesenhar.
  const alvo = document.createElement('div'); body.appendChild(alvo);
  const it = itens[i];
  if (it.lista) renderListaUnica(alvo, it.lista); else it.fn(alvo);
}
// ── Cadastros barrados ────────────────────────────────────────────────
// Quem tentou se cadastrar, o app viu que o nome bate com alguém que JÁ está na
// pastoral, e a prova (data de nascimento ou nome da mãe) não conferiu. O cadastro
// trava — decisão do dono — e a pessoa cai aqui. Sem esta tela ela sumiria na porta
// sem ninguém ficar sabendo, que é o preço de travar.
async function renderBarrados(b){
  b.textContent='';
  const hint=document.createElement('p'); hint.style.cssText='font-size:12px;color:var(--text-muted);margin:0 0 8px;line-height:1.5;';
  hint.innerHTML='Alguém tentou se cadastrar com um nome que já existe no cadastro e não conseguiu provar que é a pessoa. '
    +'Confira por fora (ligue, pergunte) e resolva aqui: <b>ligar</b> junta a conta dela à ficha que já existe; '
    +'<b>não é a mesma pessoa</b> libera para ela se cadastrar normalmente.';
  b.appendChild(hint);
  const box=document.createElement('div'); box.innerHTML='<span class="loading">Carregando...</span>'; b.appendChild(box);
  const { data, error } = await sb.from('acolitos_vinculo_tentativas')
    .select('id,quando,user_id,nome_digitado,nascimento_informado,nome_mae_informado,resultado,membro_id')
    .eq('resolvido', false).order('quando', { ascending:false }).limit(100);
  box.textContent='';
  if(error){ box.textContent='Não consegui ler a fila agora.'; return; }
  if(!data || !data.length){
    const ok=document.createElement('p'); ok.style.cssText='font-size:13px;color:var(--text-muted);';
    ok.textContent='Ninguém barrado. Quando alguém esbarrar, aparece aqui.';
    box.appendChild(ok); return;
  }
  // Os nomes das fichas suspeitas, para a coordenação ver quem é quem.
  const ids=[...new Set(data.map(t=>t.membro_id).filter(Boolean))];
  const fichas={};
  if(ids.length){
    const { data:ms } = await sb.from('acolitos_membros').select('id,nome,data_nascimento,nome_mae').in('id', ids);
    (ms||[]).forEach(m=>{ fichas[m.id]=m; });
  }
  const mini=(txt,danger)=>{ const x=document.createElement('button'); x.textContent=txt; x.style.cssText='font-size:11px;font-weight:700;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;border:1px solid '+(danger?'var(--danger)':'var(--gold-dim)')+';background:var(--surface2);color:'+(danger?'var(--danger-text)':'var(--gold-light)')+';'; return x; };
  const dia=t=>{ try{ return new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };

  data.forEach(t=>{
    const f=fichas[t.membro_id];
    const row=document.createElement('div');
    row.style.cssText='border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface2);';
    const tit=document.createElement('div'); tit.style.cssText='font-weight:700;color:var(--gold-light);';
    tit.textContent=t.nome_digitado;
    const sub=document.createElement('div'); sub.style.cssText='font-size:12px;color:var(--text-muted);margin:4px 0 8px;line-height:1.6;';
    sub.innerHTML='tentou em '+escHtml(dia(t.quando))
      +'<br>informou: nascimento <b>'+escHtml(t.nascimento_informado||'—')+'</b>, mãe <b>'+escHtml(t.nome_mae_informado||'—')+'</b>'
      +(f ? '<br>a ficha que já existe: <b>'+escHtml(f.nome)+'</b> — nascimento <b>'+escHtml(f.data_nascimento||'—')+'</b>, mãe <b>'+escHtml(f.nome_mae||'—')+'</b>' : '');
    const acoes=document.createElement('div'); acoes.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';
    if(f && t.user_id){
      const bl=mini('É a mesma pessoa — ligar');
      bl.onclick=async()=>{
        if(!(await uiConfirm('Ligar a conta de quem tentou à ficha de '+f.nome+'?'))) return;
        const r=await apiPost('/api/acolito-admin',{action:'vincular',membro_id:f.id,user_id:t.user_id});
        if(!r.ok){ await uiAlert('Não deu: '+((r.data&&r.data.error)||'tente de novo')); return; }
        await sb.from('acolitos_vinculo_tentativas').update({ resolvido:true, resolvido_em:new Date().toISOString() }).eq('id', t.id);
        await uiAlert('Pronto. '+f.nome+' entra com a ficha dela.');
        renderBarrados(b);
      };
      acoes.appendChild(bl);
    }
    const bn=mini('Não é a mesma pessoa — liberar');
    bn.onclick=async()=>{
      if(!(await uiConfirm('Liberar para que essa pessoa se cadastre como alguém novo?'))) return;
      await sb.from('acolitos_vinculo_tentativas').update({ resolvido:true, liberado:true, resolvido_em:new Date().toISOString() }).eq('id', t.id);
      await uiAlert('Liberado. Peça para ela tentar o cadastro de novo.');
      renderBarrados(b);
    };
    const bx=mini('Arquivar', true);
    bx.onclick=async()=>{
      await sb.from('acolitos_vinculo_tentativas').update({ resolvido:true, resolvido_em:new Date().toISOString() }).eq('id', t.id);
      renderBarrados(b);
    };
    acoes.append(bn, bx);
    row.append(tit, sub, acoes); box.appendChild(row);
  });
}

// ── Logins (usuário/senha) — só superadmin ──
async function renderLogins(b){
  b.textContent='';
  const hint=document.createElement('p'); hint.style.cssText='font-size:12px;color:var(--text-muted);margin:0 0 8px;line-height:1.5;';
  hint.innerHTML='Usuário e login de cada membro. <b>A senha não fica guardada</b> — vive só no login seguro (criptografada). Para trocar, use <b>Redefinir senha</b>: a nova é mostrada uma única vez, anote na hora. Só superadmin vê esta tela.';
  b.appendChild(hint);
  const box=document.createElement('div'); box.innerHTML='<span class="loading">Carregando...</span>'; b.appendChild(box);
  const { data } = await sb.rpc('acolitos_logins_listar');
  box.textContent='';
  if(!data || data.erro){ box.textContent='Sem permissão.'; return; }
  const membros = data.membros || [];
  const busca=document.createElement('input'); busca.className='form-input'; busca.placeholder='buscar membro…'; busca.style.marginBottom='8px'; box.appendChild(busca);
  const list=document.createElement('div'); box.appendChild(list);
  const mini=(txt,danger)=>{ const x=document.createElement('button'); x.textContent=txt; x.style.cssText='font-size:11px;font-weight:700;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;border:1px solid '+(danger?'var(--danger)':'var(--gold-dim)')+';background:var(--surface2);color:'+(danger?'var(--danger-text)':'var(--gold-light)')+';'; return x; };
  async function setSenha(m){
    const s=((await uiPrompt('Nova senha para '+m.nome+' (mín. 6 caracteres):'))||'').trim(); if(!s) return; if(s.length<6){await uiAlert('Senha muito curta.');return;}
    const r=await apiPost('/api/acolito-admin',{action:'password',user_id:m.user_id,password:s});
    if(!r.ok){await uiAlert('Erro: '+((r.data&&r.data.error)||'tente de novo'));return;}
    await uiAlert('Senha de '+m.nome+' redefinida:\n\n'+s+'\n\n⚠️ Anote agora — ela NÃO fica salva e não será mostrada de novo.');
  }
  async function setUser(m){
    const u=((await uiPrompt('Novo usuário (login) de '+m.nome+':', {value:m.usuario||''}))||'').trim(); if(!u) return;
    const r=await apiPost('/api/acolito-admin',{action:'username',user_id:m.user_id,usuario:u});
    if(!r.ok){await uiAlert('Erro: '+((r.data&&r.data.error)||'tente de novo'));return;}
    await sb.rpc('acolitos_login_registrar',{p_membro:m.id,p_usuario:u,p_senha:null});
    m.usuario=u; desenha();
  }
  async function criarConta(m){
    const u=((await uiPrompt('Usuário (login) de '+m.nome+':'))||'').trim(); if(!u) return;
    const s=((await uiPrompt('Senha (mín. 6 caracteres):'))||'').trim(); if(!s){return;} if(s.length<6){await uiAlert('Senha muito curta.');return;}
    const r=await apiPost('/api/acolito-admin',{action:'create',usuario:u,password:s,nome:m.nome,membro_id:m.id});
    if(!r.ok){await uiAlert('Erro: '+((r.data&&r.data.error)||'tente de novo'));return;}
    await sb.rpc('acolitos_login_registrar',{p_membro:m.id,p_usuario:u,p_senha:null});
    await uiAlert('Conta criada para '+m.nome+'.\nUsuário: '+u+'\nSenha: '+s+'\n\n⚠️ Anote a senha agora — ela NÃO fica salva e não será mostrada de novo.');
    m.tem_conta=true; if(r.data&&r.data.user_id) m.user_id=r.data.user_id; m.usuario=u; desenha();
  }
  function desenha(){
    list.textContent=''; const q=busca.value.trim().toLowerCase();
    const arr=membros.filter(m=>!q||semAcento(m.nome).includes(semAcento(q)));
    arr.slice(0,300).forEach(m=>{
      const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--border);';
      const info=document.createElement('div'); info.style.cssText='flex:1;min-width:0;';
      const nm=document.createElement('div'); nm.style.cssText='font-weight:700;font-size:13px;color:var(--text);'; nm.textContent=m.nome;
      const sub=document.createElement('div'); sub.style.cssText='font-size:11px;color:var(--text-muted);word-break:break-all;';
      if(m.tem_conta){ sub.innerHTML='usuário: <b style="color:var(--gold-light)">'+escHtml(m.usuario||'—')+'</b>'; }
      else { sub.innerHTML='<i style="color:var(--danger-text)">sem conta</i>'; }
      info.append(nm,sub); row.appendChild(info);
      if(m.tem_conta){ const bu=mini('Usuário'); bu.onclick=()=>setUser(m); const bs=mini('Redefinir senha'); bs.onclick=()=>setSenha(m); row.append(bu,bs); }
      else { const bc=mini('Criar conta'); bc.onclick=()=>criarConta(m); row.append(bc); }

  }
  busca.oninput=desenha; desenha();
}
// ── ATIVIDADE: quem está usando o app, e quem tem o sino ligado ───────────────
// O dono pediu "último uso de cada pessoa e se já está com notificação ativada".
//
// O QUE "ÚLTIMO USO" NÃO É: não é a última vez que a pessoa digitou a senha. O app
// fica logado, então quem entrou uma vez em junho e usa todo dia continuaria
// marcada como junho. Medido em 20/08: isso valia para 32 das 41 contas — a tela
// teria mentido sobre 78% do grupo. A fonte é a SESSÃO, que sobe toda vez que o
// app é aberto de verdade (migration 059 explica em detalhe).
//
// Os recortes de tempo são feitos AQUI, e não no banco, porque dependem do fuso de
// quem está olhando — este projeto já pagou caro por data derivada no servidor.
async function renderAtividade(b){
  b.textContent='';
  const hint=document.createElement('p');
  hint.style.cssText='font-size:12px;color:var(--text-muted);margin:0 0 10px;line-height:1.5;';
  hint.innerHTML='Quem abriu o app e quando, e quem já ligou o sino das notificações. '
    +'<b>“Usou” é a última vez que a pessoa abriu o app</b> — não a última vez que digitou a senha, '
    +'que fica meses parada em quem nunca sai da conta. Só leitura, e só superadmin vê.';
  b.appendChild(hint);

  const box=document.createElement('div'); box.innerHTML='<span class="loading">Carregando...</span>'; b.appendChild(box);
  const { data, error } = await sb.rpc('acolitos_atividade_listar');
  box.textContent='';
  // Falha de consulta NÃO pode virar "ninguém usou o app": é o defeito que este
  // projeto já teve (um erro virando R$ 0,00 por 17 horas).
  if(error){ box.innerHTML='<span class="empty">Não consegui perguntar ao banco. Recarregue a tela.</span>'; return; }
  if(!data || data.erro){ box.innerHTML='<span class="empty">Sem permissão.</span>'; return; }

  const contas=data.contas||[], semConta=data.sem_conta||[];

  // ── quando foi, em português ───────────────────────────────────────────────
  const DIA=86400000;
  const diaDe=(d)=>{ const x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  const hoje0=diaDe(new Date());
  function diasAtras(iso){ return Math.round((hoje0 - diaDe(new Date(iso)))/DIA); }
  function quandoFoi(iso){
    const d=new Date(iso), n=diasAtras(iso);
    const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}).replace(':','h');
    const data=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    if(n<=0) return 'hoje às '+hora;
    if(n===1) return 'ontem às '+hora;
    if(n<7)   return 'há '+n+' dias · '+data;
    if(n<30)  return 'há '+Math.floor(n/7)+(Math.floor(n/7)===1?' semana':' semanas')+' · '+data;
    const m=Math.floor(n/30);
    return 'há '+m+(m===1?' mês':' meses')+' · '+d.toLocaleDateString('pt-BR');
  }
  // Cada beco tem a SUA frase. "Nunca entrou" e "a sessão expirou" são coisas
  // diferentes, e um traço no lugar das duas faria a coordenação tratar igual.
  function estadoDe(c){
    if(c.ultimo_uso) { const n=diasAtras(c.ultimo_uso);
      return { chave:n<=0?'hoje':n<7?'semana':n<30?'mes':'sumido',
               texto:'Usou '+quandoFoi(c.ultimo_uso),
               cor:n<7?'var(--success-text)':n<30?'var(--text)':'var(--danger-text)' }; }
    if(c.entrou_em) return { chave:'expirou',
      texto:'Sumiu faz tempo — entrou pela última vez '+quandoFoi(c.entrou_em),
      cor:'var(--danger-text)' };
    return { chave:'nunca',
      texto:'Nunca entrou — a conta foi criada '+quandoFoi(c.criada_em)+' e nunca foi usada',
      cor:'var(--danger-text)' };
  }
  contas.forEach(c=>{ c._e=estadoDe(c); });

  // Quem preocupa vem primeiro: nunca entrou, depois quem sumiu, depois o resto.
  const ORDEM={nunca:0,expirou:1,sumido:2,mes:3,semana:4,hoje:5};
  contas.sort((a,x)=> (ORDEM[a._e.chave]-ORDEM[x._e.chave]) || a.nome.localeCompare(x.nome,'pt-BR'));

  // ── o resumo ───────────────────────────────────────────────────────────────
  const conta=(k)=>contas.filter(c=>c._e.chave===k).length;
  const resumo=document.createElement('div');
  resumo.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;';
  [['Hoje',conta('hoje'),'var(--success-text)'],
   ['Nesta semana',conta('semana'),'var(--gold-light)'],
   ['Neste mês',conta('mes'),'var(--text)'],
   ['Sumiram',conta('sumido')+conta('expirou'),'var(--danger-text)'],
   ['Nunca entraram',conta('nunca'),'var(--danger-text)'],
   ['Com o sino',contas.filter(c=>c.sino).length,'var(--gold)']
  ].forEach(([rot,val,cor])=>{
    const k=document.createElement('div');
    k.style.cssText='flex:1 1 90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;';
    const v=document.createElement('div'); v.style.cssText='font-family:Sora,sans-serif;font-weight:800;font-size:18px;color:'+cor+';'; v.textContent=val;
    const r=document.createElement('div'); r.style.cssText='font-size:10px;color:var(--text-muted);margin-top:1px;'; r.textContent=rot;
    k.append(v,r); resumo.appendChild(k);
  });
  box.appendChild(resumo);

  // ── os que nem conta têm ───────────────────────────────────────────────────
  // Não é rodapé: em 20/08 são 135 de 176 ativos, e é a informação mais acionável
  // da tela — essa gente não consegue abrir o app de jeito nenhum.
  if(semConta.length){
    const av=document.createElement('div');
    av.style.cssText='background:var(--surface);border:1px solid var(--border-wine);border-radius:10px;padding:10px 12px;margin-bottom:12px;';
    const t=document.createElement('div'); t.style.cssText='font-size:12px;color:var(--text);line-height:1.5;';
    t.innerHTML='<b>'+semConta.length+' das '+data.ativos+' pessoas ativas ainda não têm login.</b> '
      +'Elas não conseguem abrir o app — não é que não usam, é que não podem. Criar conta é em <b>Logins</b>.';
    const bt=document.createElement('button');
    bt.style.cssText='margin-top:8px;font-size:11px;font-weight:700;padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--gold-dim);background:var(--surface2);color:var(--gold-light);';
    bt.textContent='Ver quem são';
    const lista=document.createElement('div'); lista.style.cssText='display:none;margin-top:8px;font-size:12px;color:var(--text-muted);line-height:1.7;';
    lista.textContent=semConta.map(m=>m.nome).join(' · ');
    bt.onclick=()=>{ const aberto=lista.style.display!=='none';
      lista.style.display=aberto?'none':'block'; bt.textContent=aberto?'Ver quem são':'Esconder'; };
    av.append(t,bt,lista); box.appendChild(av);
  }

  // ── a lista ────────────────────────────────────────────────────────────────
  const busca=document.createElement('input'); busca.className='form-input';
  busca.placeholder='buscar pessoa…'; busca.style.marginBottom='8px'; box.appendChild(busca);
  const list=document.createElement('div'); box.appendChild(list);

  function desenha(){
    list.textContent='';
    const q=busca.value.trim().toLowerCase();
    const arr=contas.filter(c=>!q||semAcento(c.nome).includes(semAcento(q))||semAcento(c.usuario||'').includes(semAcento(q)));
    if(!arr.length){ const e=document.createElement('span'); e.className='empty'; e.textContent='Ninguém com esse nome.'; list.appendChild(e); return; }
    arr.forEach(c=>{
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);';
      const av=buildAvatarEl(c.foto_url, nivelInfo(c.nivel||'aspirante').base, 34,
        { nivelSlug:c.nivel||'aspirante', casaSlug:casaSlugDe(c) });
      av.style.flexShrink='0'; row.appendChild(av);

      const info=document.createElement('div'); info.style.cssText='flex:1;min-width:0;';
      const nm=document.createElement('div'); nm.style.cssText='font-weight:700;font-size:13px;color:var(--text);'; nm.textContent=c.nome;
      const uso=document.createElement('div'); uso.style.cssText='font-size:11px;margin-top:1px;color:'+c._e.cor+';'; uso.textContent=c._e.texto;
      const usr=document.createElement('div'); usr.style.cssText='font-size:10px;color:var(--text-muted);margin-top:1px;'; usr.textContent='usuário: '+(c.usuario||'—');
      info.append(nm,uso,usr); row.appendChild(info);

      const sino=document.createElement('div');
      sino.style.cssText='flex-shrink:0;text-align:right;font-size:10px;font-weight:700;line-height:1.4;';
      if(c.sino){
        sino.style.color='var(--success-text)';
        sino.innerHTML='🔔 ligado<br><span style="font-weight:400;color:var(--text-muted)">desde '
          +new Date(c.sino_desde).toLocaleDateString('pt-BR')
          +(c.aparelhos>1?'<br>'+c.aparelhos+' inscrições':'')+'</span>';
      } else {
        sino.style.color='var(--text-muted)';
        sino.innerHTML='🔕 desligado';
      }
      row.appendChild(sino);
      list.appendChild(row);
    });
  }
  busca.oninput=desenha; desenha();
}
async function setConfig(chave, valor){
  const { error } = await sb.from('acolitos_config').upsert({ chave, valor, updated_by: ctx.user.id, updated_at: new Date().toISOString() }, { onConflict:'chave' });
  if (error) { toast('Erro ao salvar.', 'error'); return false; }
  _APP_CONFIG[chave] = valor; toast('✓ Salvo!'); return true;
}
// ── AS LISTAS QUE A PARÓQUIA EDITA ────────────────────────────
// Eram SEIS editores copiados pelo app (cinco aqui, um no fim da tela de Ausências), todos
// gravando na mesma tabela `acolitos_listas` e mudando só a palavra do `tipo`. Agora é um só,
// e cada lista se declara nesta tabela. Acrescentar uma lista passa a ser uma linha aqui.
const LISTAS_CFG = [
  { tipo:'competencia',    nome:'Competências',            dica:'O plano de desenvolvimento — aparecem na Jornada, em Competências de cada membro.', novo:'Nova competência…' },
  { tipo:'habilidade',     nome:'Habilidades',             dica:'O que a pessoa sabe fazer. É o mesmo que as funções litúrgicas veem como habilitação.', novo:'Nova habilidade…' },
  { tipo:'funcao',         nome:'Funções litúrgicas',      dica:'As funções da celebração. A marca “Maior” reserva a função para cerimoniário no gerador. As do sistema não podem ser removidas — só as que você criar.', novo:'Nova função (ex.: Báculo Auxiliar)', slug:true,
    // As 13 do sistema aparecem junto das criadas aqui. Sem isto, elas sumiriam da tela e não
    // haveria como marcar "Maior" nelas — que é justamente onde essa marca costuma valer.
    // É função e não lista pronta porque FUNCOES_MODELO é declarada mais abaixo no arquivo.
    padroes: () => (typeof FUNCOES_MODELO !== 'undefined' ? FUNCOES_MODELO : []),
    extra:{ modo:'interruptor', chave:'funcoes_maiores', rotulo:'Maior' } },
  { tipo:'tipo_evento',    nome:'Tipos de evento',        dica:'Ficam disponíveis ao criar um evento na Agenda (ensaio, retiro, procissão…). A cor é a bolinha no calendário.', novo:'Novo tipo de evento (ex.: Procissão)', slug:true,
    extra:{ modo:'cor', rotulo:'Cor no calendário' } },
  { tipo:'tipo_celebracao',nome:'Tipos de celebração',     dica:'Ficam disponíveis ao criar uma celebração e aparecem na Agenda.', novo:'Novo tipo (ex.: Missa de Formatura)', slug:true },
  { tipo:'cat_entrada',    nome:'Tesouraria — entradas',   dica:'Categorias de dinheiro que entra.', novo:'Nova categoria de entrada…' },
  { tipo:'cat_saida',      nome:'Tesouraria — saídas',     dica:'Categorias de dinheiro que sai.',   novo:'Nova categoria de saída…' },
  { tipo:'motivo',         nome:'Motivos de ausência',     dica:'As opções que a pessoa escolhe ao avisar que não pode servir.', novo:'Novo motivo…' },
];

// O apelido de sistema saía de seis cópias iguais desta conta. Agora é uma só.
function slugDe(texto) {
  return String(texto||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w]+/g,'_').replace(/^_|_$/g,'');
}

// O ÚNICO editor de listas. Cada lista se declara em LISTAS_CFG; o que muda entre elas é
// texto e, em duas, um campo extra por item.
// Desenha UMA lista. Antes esta função também escolhia qual, com uma fila de oito abas cravada
// dentro dela; escolher passou a ser da seção (desenharSecao), e a fila virou o mecanismo geral.
async function renderListaUnica(b, tipo){
  b.textContent='';
  const conf = LISTAS_CFG.find(x=>x.tipo===tipo) || LISTAS_CFG[0];

  const dica=document.createElement('p'); dica.style.cssText='font-size:12px;color:var(--text-muted);margin:0 0 10px;';
  dica.textContent=conf.dica; b.appendChild(dica);

  const [{ data, error:errLista }, { data:cfgRow, error:errExtra }] = await Promise.all([
    sb.from('acolitos_listas').select('id,valor,label,meta').eq('tipo',conf.tipo).order('label'),
    (conf.extra && conf.extra.chave) ? sb.from('acolitos_config').select('valor').eq('chave',conf.extra.chave).maybeSingle()
               : Promise.resolve({ data:null, error:null }),
  ]);

  // Falha de consulta NÃO pode virar lista vazia: na tela, zero item é indistinguível de
  // "não há nada cadastrado" — e alguém sairia recriando o que já existe.
  if (errLista) {
    console.error('Listas: carregar '+conf.tipo+' falhou', errLista);
    const e=document.createElement('div'); e.className='empty';
    e.textContent='Não foi possível carregar '+conf.nome.toLowerCase()+'. Isto é falha de carregamento, não lista vazia — recarregue a página.';
    b.appendChild(e); return;
  }

  // Sem saber o que já está gravado, editar o campo extra apagaria o dos OUTROS itens (o valor
  // é um objeto/lista única). Por isso, se a leitura falhar, o extra fica travado.
  const extraOk = !errExtra;
  if (conf.extra && !extraOk) {
    console.error('Listas: carregar '+conf.extra.chave+' falhou', errExtra);
    const av=document.createElement('div'); av.className='empty'; av.style.marginBottom='8px';
    av.textContent='Não foi possível carregar o campo "'+conf.extra.rotulo+'". A edição dele está bloqueada até recarregar; o resto da lista funciona.';
    b.appendChild(av);
  }
  // Quando nada foi configurado, o padrão TEM de ser o mesmo que o gerador aplica — senão a
  // tela mostraria tudo desmarcado enquanto sete funções seguem valendo como maiores, e quem
  // olhasse acreditaria numa regra que não é a que está em vigor.
  const padraoExtra = (conf.extra && conf.extra.modo==='interruptor')
    ? ((typeof GeradorSubstituto!=='undefined' && GeradorSubstituto.MAIORES_PADRAO) || []) : {};
  const guardado = (extraOk && cfgRow && cfgRow.valor != null) ? cfgRow.valor : padraoExtra;
  const marcados = new Set(Array.isArray(guardado) ? guardado : []);
  const textos = (!Array.isArray(guardado) && typeof guardado==='object') ? { ...guardado } : {};

  async function gravarExtra(valor){
    const { error } = await sb.from('acolitos_config')
      .upsert({ chave:conf.extra.chave, valor, updated_at:new Date().toISOString() }, { onConflict:'chave' });
    if (error) { console.error('Listas: gravar '+conf.extra.chave+' falhou', error); toast('Não foi possível salvar.','error'); return false; }
    if (typeof _APP_CONFIG!=='undefined' && _APP_CONFIG) _APP_CONFIG[conf.extra.chave]=valor;
    toast('✓ Salvo!'); return true;
  }

  // Padrões do sistema primeiro, depois os que a paróquia criou. O padrão não tem `id`, e é
  // isso que impede removê-lo: ele vive no código, não numa linha do banco.
  const doSistema = (typeof conf.padroes === 'function' ? conf.padroes() : [])
    .map(([valor,label]) => ({ valor, label, doSistema:true }));
  const criados = (data||[]).map(x => ({ ...x, doSistema:false }));
  const jaTem = new Set(criados.map(x => x.valor));
  const itens = [...doSistema.filter(x => !jaTem.has(x.valor)), ...criados];

  itens.forEach(item=>{
    const row=document.createElement('div'); row.style.cssText='padding:8px 2px;border-bottom:1px solid var(--border);';
    // `flex-wrap` e `min-width:0` são o conserto do conteúdo que estourava a tela: sem eles o
    // nome não encolhe nem deixa a fila quebrar, e empurra o apelido de sistema e a caixinha
    // "Maior" para fora da borda direita. Num celular de 390px o "Maior" saía cortado.
    const top=document.createElement('div'); top.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    const nm=document.createElement('span'); nm.style.cssText='flex:1 1 140px;min-width:0;overflow-wrap:anywhere;'; nm.textContent=item.label||item.valor;
    if (item.doSistema) { const et=document.createElement('span'); et.style.cssText='font-size:10px;color:var(--text-muted);margin-left:6px;white-space:nowrap;'; et.textContent='do sistema'; nm.appendChild(et); }
    top.appendChild(nm);
    if (conf.slug) { const sl=document.createElement('span'); sl.style.cssText='font-size:11px;color:var(--text-muted);'; sl.textContent=item.valor; top.appendChild(sl); }

    if (conf.extra && conf.extra.modo==='interruptor') {
      const lb=document.createElement('label'); lb.style.cssText='display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted);cursor:pointer;';
      const ck=document.createElement('input'); ck.type='checkbox'; ck.checked=marcados.has(item.valor); ck.disabled=!extraOk;
      ck.onchange=async()=>{ ck.disabled=true;
        const antes=new Set(marcados);
        if (ck.checked) marcados.add(item.valor); else marcados.delete(item.valor);
        // Volta ao estado anterior se a gravação falhar: deixar marcado sem ter salvo faria a
        // pessoa acreditar numa regra que o gerador não vai aplicar.
        if (!await gravarExtra([...marcados])) { marcados.clear(); antes.forEach(v=>marcados.add(v)); ck.checked=antes.has(item.valor); }
        ck.disabled=!extraOk; };
      const tx=document.createElement('span'); tx.textContent=conf.extra.rotulo;
      lb.append(ck,tx); top.appendChild(lb);
    }

    if (!item.doSistema) {
      // Renomear existia no editor antigo das funções e faz falta: um erro de digitação no
      // nome obrigaria a apagar e recriar, e apagar perde a marca de "Maior" junto.
      const ed=document.createElement('button'); ed.className='mini-add'; ed.innerHTML=_svgIcon('editar');
      ed.title='Renomear'; ed.style.cssText='width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;';
      ed.onclick=async()=>{
        const nv=await uiPrompt('Novo nome para "'+(item.label||item.valor)+'":', { value:item.label||item.valor });
        if (nv==null) return;
        const t=String(nv).trim(); if (!t) return;
        const { error } = await sb.from('acolitos_listas').update({ label:t }).eq('id',item.id);
        if (error) { console.error('Listas: renomear falhou', error); toast('Não foi possível renomear.','error'); return; }
        renderListaUnica(b, conf.tipo); };
      top.appendChild(ed);
      const del=document.createElement('button'); del.className='mini-del'; del.textContent='−';
      del.onclick=async()=>{
        // O aviso de "quantas tarefas e pessoas ainda dependem" era para os TIMES, que saíram
        // desta lista e viraram seção própria (As pessoas › Times) — o aviso foi junto, para lá.
        // Aqui ficaria código que nunca roda, e código morto com cara de vivo engana na leitura.
        if(!await uiConfirm('Remover "'+(item.label||item.valor)+'"?'))return;
        const { error } = await sb.from('acolitos_listas').delete().eq('id',item.id);
        if (error) { console.error('Listas: remover falhou', error); toast('Não foi possível remover.','error'); return; }
        renderListaUnica(b, conf.tipo); };
      top.appendChild(del);
    }
    row.appendChild(top);

    if (conf.extra && conf.extra.modo==='cor') {
      // A cor mora no `meta` da própria linha, não em acolitos_config: é um dado DE CADA item,
      // e a coluna já existia vazia em todas as linhas. Assim não há segundo lugar para
      // desencontrar do primeiro.
      const cor=document.createElement('input'); cor.type='color'; cor.title=conf.extra.rotulo;
      cor.style.cssText='width:34px;height:26px;padding:0;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;';
      cor.value=(item.meta && item.meta.cor) || '#7f8c8d';
      cor.onchange=async()=>{
        const novaCor=cor.value, corAnterior=(item.meta&&item.meta.cor)||'#7f8c8d';
        cor.disabled=true;
        const { error } = await sb.from('acolitos_listas')
          .update({ meta: { ...(item.meta||{}), cor: novaCor } }).eq('id', item.id);
        cor.disabled=false;
        // Volta à cor anterior se a gravação falhar: deixar a cor nova na tela faria a pessoa
        // acreditar num ajuste que a Agenda não vai mostrar.
        if (error) { console.error('Listas: gravar cor falhou', error); toast('Não foi possível salvar a cor.','error'); cor.value=corAnterior; return; }
        item.meta = { ...(item.meta||{}), cor: novaCor }; toast('✓ Salvo!');
      };
      top.insertBefore(cor, del);
    }

    if (conf.extra && conf.extra.modo==='texto') {
      const ta=document.createElement('textarea'); ta.className='form-input'; ta.rows=2;
      ta.style.cssText='margin-top:6px;font-size:12px;'; ta.placeholder=conf.extra.rotulo;
      ta.value=textos[item.valor]||''; ta.disabled=!extraOk;
      const sv=document.createElement('button'); sv.className='btn-sm'; sv.style.marginTop='6px'; sv.textContent='Salvar'; sv.disabled=!extraOk;
      sv.onclick=async()=>{ const t=ta.value.trim(); const novo={ ...textos };
        if (t) novo[item.valor]=t; else delete novo[item.valor];
        sv.disabled=true; const ok=await gravarExtra(novo); sv.disabled=!extraOk;
        // Só espelha localmente depois de confirmado: senão o PRÓXIMO salvar, de outro item,
        // gravaria por cima de algo que nem chegou a ser salvo.
        if (ok) { if (t) textos[item.valor]=t; else delete textos[item.valor]; } };
      row.append(ta,sv);
    }
    b.appendChild(row);
  });

  const add=document.createElement('div'); add.style.cssText='display:flex;gap:8px;margin-top:10px;';
  const inp=document.createElement('input'); inp.className='form-input'; inp.placeholder=conf.novo;
  const bt=document.createElement('button'); bt.className='mini-add'; bt.textContent='+';
  bt.onclick=async()=>{ const v=inp.value.trim(); if(!v)return;
    const { error } = await sb.from('acolitos_listas').insert({ tipo:conf.tipo, valor:slugDe(v), label:v });
    if (error) { console.error('Listas: criar falhou', error); toast('Não foi possível criar.','error'); return; }
    inp.value=''; renderListaUnica(b, conf.tipo); };
  add.append(inp,bt); b.appendChild(add);
}

// CRUD da lista de setores (acolitos_listas tipo='setor') + a responsabilidade fixa
// de cada um (o que o time É, ano após ano — mora em acolitos_config, chave
// 'responsabilidades', formato { slug: texto }; não é tarefa, por isso não vive em
// acolitos_tarefas). Aparece na tela Tarefas, no topo do grupo de cada time.
// [Equipe] — é equipe? participa de escalas? setores
// Ficha única da pessoa: papel na equipe, escalas, TIMES e permissões, tudo num lugar.
// Antes eram dois modais ("Equipe" e "Permissões") sobre a mesma pessoa, e era preciso
// adivinhar em qual deles morava cada coisa.
//
// Os times aqui passam pela MESMA regra das outras portas (times-core.js). O editor antigo
// gravava `setores` na mão: era um terceiro caminho, com lista fixa e sem a boas-vinda.
function abrirFichaPessoa(m, role, times, onSaved){
  const ov=document.createElement('div'); ov.className='modal-overlay open'; ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  const md=document.createElement('div'); md.className='modal'; md.style.maxWidth='440px';
  const tt=document.createElement('div'); tt.className='modal-title'; tt.textContent=m.nome; md.appendChild(tt);
  const ehAdmin=['coord_admin','subadmin'].includes(role);
  if(ehAdmin){ const w=document.createElement('div'); w.style.cssText='font-size:12px;color:var(--gold);margin:-6px 0 8px;'; w.textContent='É admin ('+(role==='coord_admin'?'Coord. Admin':'Subadmin')+') — o papel não muda por aqui.'; md.appendChild(w); }

  let ehEquipe=!!m.eh_equipe, serve=m.serve!==false;
  const setoresAntes=(m.setores||[]).slice();
  const setoresSel=new Set(setoresAntes);
  const permsSel=new Set(m.permissoes||[]);
  const lab=(t)=>{ const l=document.createElement('div'); l.style.cssText='font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;'; l.textContent=t; return l; };

  md.appendChild(lab('Faz parte da equipe/coordenação?'));
  md.appendChild(_toggleSimNao(ehEquipe, v=>{ehEquipe=v;}).el);
  md.appendChild(lab('Participa das escalas (Minha Jornada)?'));
  md.appendChild(_toggleSimNao(serve, v=>{serve=v;}).el);

  md.appendChild(lab('Times'));
  // Do banco, e não da lista fixa: time criado na aba Times aparece aqui na hora.
  md.appendChild(_chipsMulti((times||[]).map(t=>[t.valor, t.label||t.valor]), setoresSel));

  md.appendChild(lab('Permissões de módulo'));
  if(!m.eh_equipe){ const w=document.createElement('div'); w.style.cssText='font-size:11.5px;color:var(--gold);margin:-2px 0 6px;'; w.textContent='Só valem depois que a pessoa for equipe.'; md.appendChild(w); }
  md.appendChild(_chipsMulti((typeof MODULOS_LIBERAVEIS!=='undefined'?MODULOS_LIBERAVEIS.map(x=>[x[0],x[1]]):[]), permsSel));

  const save=document.createElement('button'); save.className='btn gold'; save.style.cssText='width:100%;margin-top:18px;'; save.textContent='Salvar';
  save.onclick=async()=>{
    const depois=[...setoresSel];
    const entrou=depois.filter(s=>setoresAntes.indexOf(s)<0);
    const saiu=setoresAntes.filter(s=>depois.indexOf(s)<0);

    // O recado é pedido ANTES de gravar: quem desistir aqui não pode acabar com a pessoa
    // dentro do time do mesmo jeito.
    let recado=null;
    if(entrou.length && typeof pedirRecadoDeBoasVindas==='function'){
      const rotulos=entrou.map(s=>(times.find(t=>t.valor===s)||{}).label||s).join(', ');
      recado=await pedirRecadoDeBoasVindas(m.nome, rotulos);
      if(recado===null) return;                      // desistiu: nada é gravado
    }

    save.disabled=true; save.textContent='Salvando...';
    // A REGRA é a de times-core, aplicada em sequência sobre uma cópia — a mesma que o
    // "+ pessoa" e o organograma das Casas usam.
    const trab={ setores:setoresAntes.slice(), eh_equipe:m.eh_equipe, user_id:m.user_id };
    let promover=null, rebaixar=null;
    const papelBase=(typeof nivelInfo==='function')?nivelInfo(m.nivel||'aspirante').base:'aspirante';
    entrou.forEach(s=>{ const r=entrarNoTime(trab, s, role); Object.assign(trab, r.patch); if(r.promoverPara) promover=r.promoverPara; });
    saiu.forEach(s=>{ const r=sairDoTime(trab, s, role, papelBase); if(r.patch) Object.assign(trab, r.patch); if(r.rebaixarPara) rebaixar=r.rebaixarPara; });

    // Sem time nenhum, quem manda é o botão da ficha. Com pelo menos um, ser equipe é
    // consequência de estar num time — o toggle não pode contradizer isso.
    const patch={ serve, permissoes:[...permsSel], setores:trab.setores,
                  eh_equipe: trab.setores.length ? true : ehEquipe };
    const { error } = await sb.from('acolitos_membros').update(patch).eq('id', m.id);
    if(error){ console.error('Ficha da pessoa: gravar falhou', error); toast('Erro ao salvar.','error'); save.disabled=false; save.textContent='Salvar'; return; }

    if(m.user_id && !ehAdmin){
      const novoRole = patch.eh_equipe ? (promover||'membro_equipe') : (rebaixar||papelBase);
      try{ await apiPost('/api/acolito-admin', { action:'sync_role', user_id:m.user_id, role:novoRole }); }catch(e){ console.warn('Ficha da pessoa: papel não sincronizou', e); }
    }
    Object.assign(m, patch);

    // Uma festa por time novo (a fila do app mostra em sequência), mas UM toque no celular:
    // três notificações seguidas por uma edição só seria assédio.
    if(entrou.length && typeof boasVindasAoTime==='function'){
      for(let i=0;i<entrou.length;i++){
        await aoEntrarNoTime({ membro:m, slug:entrou[i], recado:recado, cliente:sb, semPush: i>0 });
      }
    }
    toast('✓ Salvo!'); ov.remove(); if(onSaved) onSaved();
  };
  md.appendChild(save);
  ov.appendChild(md); document.body.appendChild(ov);
}

function funcoesDoModelo(){

// O que ainda depende de um time, em número. Falha de consulta NÃO vira "nada depende":
// dizer que está limpo sem ter conseguido perguntar é o que faz alguém apagar tranquilo.
async function avisoDeTimeEmUso(slug) {
  const [tar, pes] = await Promise.all([
    sb.from('acolitos_tarefas').select('id', { count:'exact', head:true }).eq('time_slug', slug).is('concluida_em', null),
    sb.from('acolitos_membros').select('id', { count:'exact', head:true }).eq('status','ativo').contains('setores', [slug]),
  ]);
  if (tar.error || pes.error) {
    console.error('Config: conferir uso do time falhou', tar.error || pes.error);
    return '\n\nNão consegui conferir se alguma tarefa ou pessoa ainda depende deste time.';
  }
  const partes = [];
  if (tar.count) partes.push(tar.count + (tar.count === 1 ? ' tarefa aberta' : ' tarefas abertas'));
  if (pes.count) partes.push(pes.count + (pes.count === 1 ? ' pessoa' : ' pessoas'));
  if (!partes.length) return '\n\nNada depende deste time.';
  return '\n\nAinda há ' + partes.join(' e ') + ' neste time. Nada disso é apagado: as tarefas'
       + ' continuam na aba Tarefas, com o nome cru do time, e as pessoas seguem marcadas nele.';
}

    sb.from('acolitos_listas').select('id,valor,label').eq('tipo','setor').order('label'),
    sb.from('acolitos_config').select('valor').eq('chave','responsabilidades').maybeSingle(),
    sb.from('acolitos_membros').select('id,nome,apelido,setores,eh_equipe,user_id,nivel').eq('status','ativo').order('nome'),
    mod ? sb.from('pastoral_members').select('user_id,role').eq('module_id', mod.id) : Promise.resolve({ data: [] }),
  ]);

  // Falha ao carregar os times NÃO vira lista vazia: zero time é indistinguível de "não há
  // nenhum cadastrado", e alguém sairia recriando o que já existe.
  if (lst.error) {
    console.error('Times: carregar falhou', lst.error);
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Não foi possível carregar os times. Isto é falha de carregamento, não lista vazia — recarregue a página.';
    b.appendChild(e); return;
  }
  const times = lst.data || [];

  // Sem os membros dá para mexer nos times, mas NÃO dá para dizer quantas pessoas há em cada
  // um. Mostrar "0 pessoas" seria inventar; a contagem some e o aviso explica.
  const temMembros = !mem.error;
  if (!temMembros) console.error('Times: carregar membros falhou', mem.error);
  const membros = mem.data || [];
  const roleMap = {}; (pms.data || []).forEach(r => { roleMap[r.user_id] = r.role; });

  // O texto "do que cuida" é UM objeto só, com todos os times dentro. Gravar sem saber o que
  // já está lá apagaria o dos outros — por isso, se a leitura falhar, o campo fica travado.
  const textoOk = !cfgRow.error;
  if (!textoOk) console.error('Times: carregar as responsabilidades falhou', cfgRow.error);
  const textos = (textoOk && cfgRow.data && cfgRow.data.valor && typeof cfgRow.data.valor === 'object' && !Array.isArray(cfgRow.data.valor))
    ? Object.assign({}, cfgRow.data.valor) : {};
  if (!temMembros || !textoOk) {
    const av = document.createElement('div'); av.className = 'empty'; av.style.marginBottom = '8px';
    av.textContent = (!temMembros && !textoOk)
      ? 'Não foi possível carregar quem está nos times nem o texto de cada um. Recarregue a página.'
      : !temMembros
        ? 'Não foi possível carregar quem está nos times. Os nomes dos times funcionam; a contagem de pessoas não aparece até recarregar.'
        : 'Não foi possível carregar o texto "do que este time cuida". A edição dele está travada até recarregar; o resto funciona.';
    b.appendChild(av);
  }

  const doTime = (slug) => membros.filter(m => (m.setores || []).indexOf(slug) >= 0);

  async function gravarTextos(novo) {
    const { error } = await sb.from('acolitos_config')
      .upsert({ chave:'responsabilidades', valor:novo, updated_at:new Date().toISOString() }, { onConflict:'chave' });
    if (error) { console.error('Times: gravar as responsabilidades falhou', error); toast('Não foi possível salvar.','error'); return false; }
    if (typeof _APP_CONFIG !== 'undefined' && _APP_CONFIG) _APP_CONFIG.responsabilidades = novo;
    toast('✓ Salvo!'); return true;
  }

  if (!times.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Nenhum time cadastrado ainda. Crie o primeiro abaixo — depois é aqui que você põe gente nele.';
    b.appendChild(e);
  }

  times.forEach(t => {
    const gente = doTime(t.valor);
    const row = document.createElement('div');
    row.style.cssText = 'border-bottom:1px solid var(--border);padding:9px 2px;';
    const top = document.createElement('div'); top.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    const info = document.createElement('div'); info.style.cssText = 'flex:1 1 150px;min-width:0;cursor:pointer;';
    const nm = document.createElement('div'); nm.style.cssText = 'font-weight:700;font-size:13px;'; nm.textContent = t.label || t.valor;
    const sub = document.createElement('div'); sub.style.cssText = 'font-size:11px;color:var(--text-muted);';
    // Sem os membros carregados NÃO se escreve nada sobre gente: "sem ninguém ainda" seria
    // afirmar vazio sem ter conseguido perguntar. O aviso lá em cima já explica o que houve.
    const partes = [];
    if (temMembros) partes.push(gente.length === 1 ? '1 pessoa' : gente.length + ' pessoas');
    const resumo = (textos[t.valor] || '').slice(0, 60);
    if (resumo) partes.push(resumo);
    sub.textContent = partes.join(' · ');
    info.append(nm, sub);

    // Com NOME, não só ícone: num celular não há como passar o mouse por cima para descobrir o
    // que um desenho faz. Dois botões mudos lado a lado deixam a pessoa sem saber em qual tocar.
    const bEd = document.createElement('button'); bEd.className = 'btn-sm gray';
    bEd.innerHTML = _svgIcon('editar') + ' Renomear'; // ícone fixo — seguro
    bEd.onclick = async () => {
      const nv = await uiPrompt('Novo nome para "' + (t.label || t.valor) + '":', { value: t.label || t.valor });
      if (nv == null) return;
      const txt = String(nv).trim(); if (!txt) return;
      const { error } = await sb.from('acolitos_listas').update({ label: txt }).eq('id', t.id);
      if (error) { console.error('Times: renomear falhou', error); toast('Não foi possível renomear.','error'); return; }
      renderTimes(b);
    };
    const bDel = document.createElement('button'); bDel.className = 'btn-sm red';
    bDel.innerHTML = _svgIcon('lixeira') + ' Remover'; // ícone fixo — seguro
    bDel.onclick = async () => {
      const extra = await avisoDeTimeEmUso(t.valor);
      if (!await uiConfirm('Remover "' + (t.label || t.valor) + '"?' + extra)) return;
      const { error } = await sb.from('acolitos_listas').delete().eq('id', t.id);
      if (error) { console.error('Times: remover falhou', error); toast('Não foi possível remover.','error'); return; }
      renderTimes(b);
    };
    // Os dois andam JUNTOS: soltos, um cabia na primeira linha e o outro caía sozinho na
    // segunda, e o par parecia acidente. Assim eles cabem os dois ou descem os dois.
    const acoes = document.createElement('div'); acoes.style.cssText = 'display:flex;gap:8px;flex:0 0 auto;';
    acoes.append(bEd, bDel);
    top.append(info, acoes); row.appendChild(top);

    // O corpo abre por toque no nome — a tela mostra os times de relance e só desce no que
    // interessa. Sem isto, dez times com gente dentro viram uma parede de nomes.
    const corpo = document.createElement('div'); corpo.style.display = 'none'; corpo.style.paddingTop = '8px';
    info.onclick = () => { corpo.style.display = corpo.style.display === 'none' ? '' : 'none'; };

    const ta = document.createElement('textarea'); ta.className = 'form-input'; ta.rows = 2;
    ta.style.cssText = 'font-size:12px;'; ta.placeholder = 'Do que este time cuida, ano após ano (aparece em Tarefas) — opcional';
    ta.value = textos[t.valor] || ''; ta.disabled = !textoOk;
    const sv = document.createElement('button'); sv.className = 'btn-sm'; sv.style.marginTop = '6px'; sv.textContent = 'Salvar texto'; sv.disabled = !textoOk;
    sv.onclick = async () => {
      const txt = ta.value.trim(); const novo = Object.assign({}, textos);
      if (txt) novo[t.valor] = txt; else delete novo[t.valor];
      sv.disabled = true; const ok = await gravarTextos(novo); sv.disabled = !textoOk;
      // Só espelha depois de confirmado: senão o próximo salvar, de outro time, gravaria por
      // cima de algo que nem chegou a ser salvo.
      if (ok) { if (txt) textos[t.valor] = txt; else delete textos[t.valor]; }
    };
    corpo.append(ta, sv);

    if (temMembros) {
      const lab = document.createElement('div');
      lab.style.cssText = 'font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;';
      lab.textContent = 'Quem está neste time';
      corpo.appendChild(lab);
      if (!gente.length) {
        const vz = document.createElement('div'); vz.style.cssText = 'font-size:12px;color:var(--text-muted);font-style:italic;';
        vz.textContent = 'Ninguém ainda.'; corpo.appendChild(vz);
      }
      gente.forEach(m => {
        const l = document.createElement('div'); l.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 0;';
        const n = document.createElement('div'); n.style.cssText = 'flex:1;font-size:13px;'; n.textContent = m.apelido || m.nome;
        const x = document.createElement('button'); x.className = 'cfg-mini danger'; x.textContent = '−'; x.title = 'Tirar deste time';
        x.onclick = async () => { await tirarDoTime(m, t.valor, roleMap, () => renderTimes(b)); };
        l.append(n, x); corpo.appendChild(l);
      });
      const bAdd = document.createElement('button'); bAdd.className = 'mini-add'; bAdd.style.marginTop = '8px';
      bAdd.textContent = '+ pessoa';
      bAdd.onclick = () => abrirEscolherPessoaTime(membros, t, roleMap, () => renderTimes(b));
      corpo.appendChild(bAdd);
    }
    row.appendChild(corpo);
    b.appendChild(row);
  });

  const add = document.createElement('div'); add.style.cssText = 'display:flex;gap:8px;margin-top:12px;';
  const inp = document.createElement('input'); inp.className = 'form-input'; inp.placeholder = 'Novo time (ex.: Logística)';
  const bt = document.createElement('button'); bt.className = 'btn-sm gold'; bt.textContent = 'Criar';
  bt.onclick = async () => {
    const nome = inp.value.trim(); if (!nome) return;
    bt.disabled = true;
    const { error } = await sb.from('acolitos_listas').insert({ tipo:'setor', valor: slugDe(nome), label: nome });
    bt.disabled = false;
    if (error) { console.error('Times: criar falhou', error); toast('Não foi possível criar.','error'); return; }
    inp.value = ''; renderTimes(b);
  };
  add.append(inp, bt); b.appendChild(add);
}

// Tirar alguém de um time. A conta de o que gravar é do times-core (compartilhado com as
// Casas); aqui só se grava e se avisa.
async function tirarDoTime(m, slug, roleMap, aoTerminar) {
  const base = (typeof nivelInfo === 'function') ? nivelInfo(m.nivel || 'aspirante').base : null;
  const r = sairDoTime(m, slug, roleMap[m.user_id], base);
  if (r.semEfeito) return;
  if (r.ultimo && !await uiConfirm('Este é o último time de ' + (m.apelido || m.nome)
      + '. Tirando daqui, a pessoa deixa de ser equipe e perde o acesso de coordenação. Continuar?')) return;
  const { error } = await sb.from('acolitos_membros').update(r.patch).eq('id', m.id);
  if (error) { console.error('Times: tirar do time falhou', error); toast('Não foi possível tirar.','error'); return; }
  if (r.rebaixarPara) {
    try { await apiPost('/api/acolito-admin', { action:'sync_role', user_id:m.user_id, role:r.rebaixarPara }); } catch (e) {}
  }
  toast(r.ultimo ? '✓ Tirado — não faz mais parte da equipe.' : '✓ Tirado do time.');
  aoTerminar();
}

function abrirEscolherPessoaTime(membros, time, roleMap, aoTerminar) {
  const ov = document.createElement('div'); ov.className = 'modal-overlay open';
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  const modal = document.createElement('div'); modal.className = 'modal'; modal.style.maxWidth = '400px';
  const tt = document.createElement('div'); tt.className = 'modal-title';
  tt.textContent = 'Adicionar a ' + (time.label || time.valor); modal.appendChild(tt);
  const busca = document.createElement('input'); busca.className = 'form-input';
  busca.placeholder = 'Buscar nome...'; busca.style.marginBottom = '10px'; modal.appendChild(busca);
  const list = document.createElement('div'); list.className = 'pick-list'; modal.appendChild(list);
  function pop() {
    const q = busca.value.trim().toLowerCase(); list.textContent = '';
    const fora = membros.filter(m => (m.setores || []).indexOf(time.valor) < 0
      && (!q || semAcento(m.nome).includes(semAcento(q))));
    if (!fora.length) {
      const e = document.createElement('div'); e.style.cssText = 'font-size:12px;color:var(--text-muted);font-style:italic;padding:8px 0;';
      e.textContent = q ? 'Ninguém encontrado.' : 'Todo mundo já está neste time.';
      list.appendChild(e); return;
    }
    fora.slice(0, 60).forEach(m => {
      const r = document.createElement('div'); r.className = 'pick-row'; r.style.cursor = 'pointer';
      const n = document.createElement('div'); n.style.cssText = 'flex:1;font-size:13px;'; n.textContent = m.apelido || m.nome;
      const sub = document.createElement('div'); sub.style.cssText = 'font-size:11px;color:var(--text-muted);';
      sub.textContent = (m.setores || []).length ? 'já em outro time' : (m.eh_equipe ? 'equipe' : 'não é equipe ainda');
      r.append(n, sub);
      r.onclick = async () => {
        // O recado é pedido ANTES de incluir: quem desiste no modal não pode acabar com a
        // pessoa dentro do time do mesmo jeito.
        const recado = await pedirRecadoDeBoasVindas(m.nome || m.apelido || '', time.label || time.valor);
        if (recado === null) return;
        const res = entrarNoTime(m, time.valor, roleMap[m.user_id]);
        const { error } = await sb.from('acolitos_membros').update(res.patch).eq('id', m.id);
        if (error) { console.error('Times: adicionar falhou', error); toast('Não foi possível adicionar.','error'); return; }
        if (res.promoverPara) {
          try { await apiPost('/api/acolito-admin', { action:'sync_role', user_id:m.user_id, role:res.promoverPara }); } catch (e) {}
        }
        await aoEntrarNoTime({ membro: m, slug: time.valor, recado: recado, cliente: sb });
        ov.remove(); toast('✓ Adicionado ao time.'); aoTerminar();
      };
      list.appendChild(r);
    });
  }
  busca.oninput = pop; pop();
  const fechar = document.createElement('button'); fechar.className = 'btn-sm gray';
  fechar.style.cssText = 'margin-top:12px;width:100%;'; fechar.textContent = 'Fechar';
  fechar.onclick = () => ov.remove(); modal.appendChild(fechar);
  ov.appendChild(modal); document.body.appendChild(ov);
  busca.focus();
}

// ── Seção Etapas do CRM: CRUD completo (reordenar, editar, excluir, adicionar) ──
function renderCrm(b){
  b.textContent='';
  const hint=document.createElement('p'); hint.style.cssText='font-size:12px;color:var(--text-muted);margin:0 0 12px;'; hint.textContent='Fases de integração do novo membro. Reordene (↑↓), edite, exclua ou adicione. A última fase é o estado "concluído".'; b.appendChild(hint);
  const DEF=[['aprovacao_cadastro','Aprovação','Aprovar o cadastro. O membro segue para a etapa de integração.'],['integracao','Integração','Reunião de integração realizada com o membro.'],['whatsapp','WhatsApp','Entrada nos grupos de WhatsApp confirmada.'],['tunica','Túnica','Recebimento da túnica confirmado.'],['disponivel_escala','Disp. Escala','Disponibilidade preenchida. Membro pronto para ser escalado.'],['integrado','Integrado','Membro totalmente integrado! Defina o nível pastoral.']];
  let work=cfg('crm_etapas',null);
  work=(Array.isArray(work)&&work.length)?work.map(e=>({slug:e.slug,label:e.label,acao:e.acao||''})):DEF.map(([slug,label,acao])=>({slug,label,acao}));
  const cont=document.createElement('div'); b.appendChild(cont);
  const repaint=()=>{
    cont.textContent='';
    work.forEach((et,i)=>{
      const card=document.createElement('div'); card.className='cfg-card';
      const hd=document.createElement('div'); hd.className='cfg-card-hd';
      const nw=document.createElement('div'); nw.className='nmwrap';
      const stp=document.createElement('div'); stp.className='stp'; stp.textContent='Fase '+(i+1)+(i===work.length-1?' · final':'');
      const li=document.createElement('input'); li.className='form-input'; li.value=et.label; li.placeholder='Nome da fase'; li.oninput=()=>{ et.label=li.value; };
      nw.append(stp,li);
      const up=document.createElement('button'); up.className='cfg-mini'; up.textContent='↑'; up.disabled=(i===0); up.onclick=()=>{ const t=work[i-1]; work[i-1]=work[i]; work[i]=t; repaint(); };
      const dn=document.createElement('button'); dn.className='cfg-mini'; dn.textContent='↓'; dn.disabled=(i===work.length-1); dn.onclick=()=>{ const t=work[i+1]; work[i+1]=work[i]; work[i]=t; repaint(); };
      const del=document.createElement('button'); del.className='cfg-mini danger'; del.textContent='×'; del.onclick=async()=>{ if(await uiConfirm('Excluir a fase "'+et.label+'"? Membros nela ficam sem etapa válida.')){ work.splice(i,1); repaint(); } };
      hd.append(nw,up,dn,del); card.appendChild(hd);
      _cfgField(card,'Texto da ação', et.acao, 'area', v=>{ et.acao=v; });
      cont.appendChild(card);
    });
  };
  repaint();
  const acts=document.createElement('div'); acts.style.cssText='display:flex;gap:8px;';
  const add=document.createElement('button'); add.className='btn'; add.textContent='+ Fase'; add.onclick=async()=>{ const nome=((await uiPrompt('Nome da nova fase:'))||'').trim(); if(!nome)return; const slug=(nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,''))||('fase_'+Date.now()); work.splice(Math.max(0,work.length-1),0,{slug,label:nome,acao:''}); repaint(); };
  const save=document.createElement('button'); save.className='btn gold'; save.textContent='Salvar fases'; save.onclick=async()=>{ await setConfig('crm_etapas', work); };
  acts.append(add,save); b.appendChild(acts);
}

// ── Seção Níveis / Jornada: lista ordenável com add/excluir + patch generator + edição do "O caminho" ──
function renderNiveis(b){
  b.textContent='';
  const hint=document.createElement('p'); hint.style.cssText='font-size:12px;color:var(--text-muted);margin:0 0 12px;'; hint.textContent='Edite, reordene (↑↓), exclua ou adicione níveis. O patch aparece ao lado — toque em "Gerar patch" pra customizar. A trilha da Jornada segue esta ordem.'; b.appendChild(hint);
  const niv=(typeof NIVEIS!=='undefined')?NIVEIS:[];
  const work=niv.map(n=>({ slug:n.slug, label:n.label, base:n.base||'acolito', int:(n.int!=null?n.int:0), pips:(n.pips!=null?n.pips:0), titulo:n.titulo||'', intro:n.intro||'', missao:n.missao||'', desafio:n.desafio||'', proximo:n.proximo||'', patch:n._patch||null }));
  const cont=document.createElement('div'); b.appendChild(cont);
  const repaint=()=>{
    cont.textContent='';
    work.forEach((w,i)=>{
      const card=document.createElement('div'); card.className='cfg-card';
      const hd=document.createElement('div'); hd.className='cfg-card-hd';
      const patch=document.createElement('div'); patch.className='cfg-patch';
      const pinta=()=>{ patch.textContent=''; if(typeof buildRankEmblem==='function') patch.appendChild(buildRankEmblem(w.slug,48,w.patch||null)); };
      pinta();
      const nw=document.createElement('div'); nw.className='nmwrap';
      const stp=document.createElement('div'); stp.className='stp'; stp.textContent='Nível '+(i+1);
      const li=document.createElement('input'); li.className='form-input'; li.value=w.label; li.placeholder='Nome'; li.oninput=()=>{ w.label=li.value; };
      nw.append(stp,li);
      const up=document.createElement('button'); up.className='cfg-mini'; up.textContent='↑'; up.disabled=(i===0); up.onclick=()=>{ const t=work[i-1]; work[i-1]=work[i]; work[i]=t; repaint(); };
      const dn=document.createElement('button'); dn.className='cfg-mini'; dn.textContent='↓'; dn.disabled=(i===work.length-1); dn.onclick=()=>{ const t=work[i+1]; work[i+1]=work[i]; work[i]=t; repaint(); };
      const del=document.createElement('button'); del.className='cfg-mini danger'; del.textContent='×'; del.onclick=async()=>{ if(await uiConfirm('Excluir o nível "'+w.label+'"? Membros nele ficam sem nível válido.')){ work.splice(i,1); repaint(); } };
      hd.append(patch,nw,up,dn,del); card.appendChild(hd);
      const gp=document.createElement('button'); gp.className='btn-sm'; gp.style.cssText='margin-top:6px;background:linear-gradient(165deg,rgba(232,185,74,.16),var(--surface2));border:1px solid var(--gold-dim);color:var(--gold-light);'; gp.textContent='🎨 Gerar patch';
      gp.onclick=()=>abrirGeradorPatch(w.slug, w.patch || _specPadraoNivel(w.slug), (spec)=>{ w.patch=spec; pinta(); }); card.appendChild(gp);
      const baseRow=document.createElement('div'); baseRow.className='cfg-fld';
      const bl=document.createElement('label'); bl.textContent='Categoria (base)';
      const bs=document.createElement('select'); bs.className='form-input';
      [['aspirante','Aspirante'],['coroinha','Coroinha'],['acolito','Acólito'],['cerimonario','Cerimoniário']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if(w.base===v)o.selected=true; bs.appendChild(o); });
      bs.onchange=()=>{ w.base=bs.value; }; baseRow.append(bl,bs); card.appendChild(baseRow);
      _cfgField(card,'Título', w.titulo, 'input', v=>{ w.titulo=v; });
      _cfgField(card,'Introdução (texto do "O caminho")', w.intro, 'area', v=>{ w.intro=v; });
      _cfgField(card,'Missão', w.missao, 'input', v=>{ w.missao=v; });
      _cfgField(card,'Desafio', w.desafio, 'area', v=>{ w.desafio=v; });
      _cfgField(card,'Próximo passo', w.proximo, 'input', v=>{ w.proximo=v; });
      cont.appendChild(card);
    });
  };
  repaint();
  const acts=document.createElement('div'); acts.style.cssText='display:flex;gap:8px;';
  const add=document.createElement('button'); add.className='btn'; add.textContent='+ Nível';
  add.onclick=async()=>{ const nome=((await uiPrompt('Nome do novo nível:'))||'').trim(); if(!nome)return; const slug=(nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,''))||('nivel_'+Date.now()); work.push({ slug, label:nome, base:'acolito', int:work.length, pips:0, titulo:'', intro:'', missao:'', desafio:'', proximo:'', patch:_specPadraoNivel('acolito_aspirante') }); repaint(); };
  const save=document.createElement('button'); save.className='btn gold'; save.textContent='Salvar níveis';
  save.onclick=async()=>{ const ok=await setConfig('niveis_full', work); if(ok){ if(typeof aplicarNiveisEstrutura==='function') aplicarNiveisEstrutura(); toast('✓ Salvo! Recarregue o app pra ver na Jornada.'); } };
  acts.append(add,save); b.appendChild(acts);
}
init();
