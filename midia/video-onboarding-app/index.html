<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Onboarding do app – Coroinhas e Acólitos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0406;--wine:#e01228;--gold:#e8b94a;--gold-l:#ffd97a;--text:#f7ebe7;--muted:#b99a96;--card:#1d0d12;--line:rgba(247,235,231,.14)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 900px at 50% 36%,#2a0d15 0%,#12060a 55%,#0a0406 100%)}
#world{position:absolute;left:0;top:0;height:1920px}
.scene{position:absolute;top:0;width:1080px;height:1920px;overflow:hidden}
.topo{position:absolute;left:90px;top:96px;width:900px;font:600 28px/1 "Plus Jakarta Sans",sans-serif;color:var(--muted)}
#prog{position:absolute;left:90px;top:160px;width:900px;height:20px}
#prog .trilho{position:absolute;left:10px;right:10px;top:9px;height:2px;background:var(--line)}
#prog .cheio{position:absolute;left:10px;top:9px;height:2px;width:0;background:linear-gradient(90deg,var(--wine),var(--gold))}
#prog .no{position:absolute;top:0;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid rgba(247,235,231,.3)}
.glow{position:absolute;left:140px;top:200px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,74,.2),transparent 65%)}
.fone{position:absolute;left:290px;top:215px;width:500px;height:880px;border-radius:64px;background:#050203;border:3px solid #3a2a2e;box-shadow:0 40px 80px rgba(0,0,0,.6);padding:16px}
.tela{position:relative;width:385px;height:701px;transform:scale(1.2);transform-origin:0 0;border-radius:50px;background:#12060a;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif;color:var(--text)}
.tela .barra{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font:700 15px/1 "Plus Jakarta Sans";color:var(--muted)}
.tela h4{font:800 25px/1.1 Sora,sans-serif;color:var(--gold-l);text-align:center;margin:10px 0 4px}
.tela .sub{font:500 13px/1.3 "Plus Jakarta Sans";color:var(--muted);text-align:center}
.tela label{display:block;margin:20px 26px 6px;font:700 11px/1 "Plus Jakarta Sans";letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.campo{margin:0 26px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;padding:0 16px;font:600 17px/1 "Plus Jakarta Sans"}
.campo.foco{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,185,74,.2)}
.btn{margin:26px 26px 0;height:54px;border-radius:14px;background:linear-gradient(90deg,var(--wine),#a60d1e);display:grid;place-items:center;font:800 18px/1 "Plus Jakarta Sans"}
.card{margin:14px 22px 0;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.card b{display:block;font:800 12px/1 "Plus Jakarta Sans";letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.card p{font:700 20px/1.25 "Plus Jakarta Sans"}.card small{display:block;margin-top:6px;font:500 13px/1.3 "Plus Jakarta Sans";color:var(--muted)}
.logo{display:block;margin:6px auto 0;width:110px}
.toast{position:absolute;left:14px;right:14px;top:56px;padding:14px 16px;border-radius:18px;background:#fff;color:#1a0b0e;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.toast i{width:38px;height:38px;border-radius:10px;background:var(--wine);flex:none}
.toast b{display:block;font:800 14px/1.2 "Plus Jakarta Sans"}.toast span{font:500 13px/1.3 "Plus Jakarta Sans";color:#5a4448}
.sw{margin:0 22px;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:700 17px/1.2 "Plus Jakarta Sans"}
.sw u{display:block;width:56px;height:32px;border-radius:16px;background:#3a2a2e;position:relative;text-decoration:none}
.sw u::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff}
.sw u.on{background:var(--gold)}.sw u.on::after{left:27px}
.chave{position:absolute;left:90px;top:1150px;font:800 200px/1 Sora,sans-serif;letter-spacing:-7px;color:var(--gold-l);white-space:nowrap}
.chave .l{display:inline-block}
.fio{position:absolute;left:90px;top:1380px;width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--wine),var(--gold));transform-origin:left}
.leg{position:absolute;left:90px;top:1430px;width:900px;height:330px;font:600 58px/1.28 "Plus Jakarta Sans",sans-serif;color:var(--text)}
.leg .fr{position:absolute;left:0;top:0;width:900px}
.leg .w{display:inline-block;margin-right:.26em;opacity:0}
.abre .brasao{position:absolute;left:290px;top:260px;width:500px}
.fim-sel{position:absolute;left:0;width:1080px;top:1790px;text-align:center;font:600 26px/1 "Plus Jakarta Sans";color:var(--muted)}
</style></head><body>
<div id="stage">
 <div class="topo">Pastoral dos Coroinhas e Acólitos · JCBP Limeira</div>
 <div id="prog"><div class="trilho"></div><div class="cheio"></div></div>
 <div id="world"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="tempos.js"></script>
<script>
gsap.registerPlugin(CustomEase);
const SaaS=CustomEase.create('saas','.86,0,.07,1');
const bar='<div class="barra"><span>9:41</span><span>●●● 5G</span></div>';
const TELAS={
 abertura:'',
 entrar:`${bar}<img class="logo" src="brasao-pastoral.png"><h4>Acólitos &amp; Coroinhas</h4><div class="sub">Entre com seu usuário</div>
  <label>Usuário</label><div class="campo foco"><span id="tx-user"></span><span id="cursor" style="opacity:.6">|</span></div>
  <label>Senha</label><div class="campo"><span id="tx-pass"></span></div><div class="btn" id="btn-entrar">Entrar</div>`,
 senha:`${bar}<h4>Crie sua senha nova</h4><div class="sub">Só você vai saber</div>
  <label>Senha nova</label><div class="campo foco"><span id="tx-n1"></span></div>
  <label>Repita a senha</label><div class="campo"><span id="tx-n2"></span></div><div class="btn" id="btn-salvar">Salvar e continuar</div>`,
 inicio:`${bar}<h4>Início</h4><div class="sub">Paz e bem!</div>
  <div class="card c1"><b>Próxima escala</b><p>Domingo · 9h</p><small>Matriz · Acólito de cruz</small></div>
  <div class="card c2"><b>Aviso da coordenação</b><p>Ensaio geral sábado</p><small>Chegue 15 minutos antes</small></div>
  <div class="card c3"><b>Seu nível</b><p>Coroinha · Nível 2</p><small>Continue servindo para evoluir</small></div>`,
 escala:`${bar}<h4>Minhas escalas</h4><div class="sub">Próximas missas</div>
  <div class="card c1"><b>Dom · 9h · Matriz</b><p>Acólito de cruz</p></div>
  <div class="card c2"><b>Sáb · 17h · Matriz</b><p>Turiferário</p></div>
  <div class="btn" id="btn-aus" style="background:transparent;border:2px solid var(--gold);color:var(--gold-l)">Registrar ausência</div>`,
 avisos:`${bar}<div class="toast" id="toast"><i></i><div><b>Escala da semana saiu</b><span>Confira o seu serviço</span></div></div>
  <h4 style="margin-top:110px">Notificações</h4><div class="sub">Receba escala e recados</div><div style="height:30px"></div>
  <div class="sw"><span>Avisar no celular</span><u id="sw1"></u></div>`,
 fecho:''
};
const world=document.getElementById('world');world.style.width=T.cenas.length*1080+'px';
const prog=document.getElementById('prog'),cheio=prog.querySelector('.cheio');
T.cenas.forEach((c,i)=>{
 const s=document.createElement('section');s.className='scene'+(i==0||i==T.cenas.length-1?' abre':'');s.style.left=i*1080+'px';s.id='s-'+c.id;
 const ponta=(i==0||i==T.cenas.length-1);
 s.innerHTML=`<div class="glow"></div>`+(ponta?`<img class="brasao" src="brasao-pastoral.png">`:`<div class="fone"><div class="tela">${TELAS[c.id]}</div></div>`)+
  `<div class="chave" style="font-size:${Math.min(200,Math.floor(900/(c.chave.length*0.6)))}px">${[...c.chave].map(ch=>`<span class="l">${ch==' '?'&nbsp;':ch}</span>`).join('')}</div><div class="fio"></div>
  <div class="leg">${c.frases.map(f=>`<div class="fr">${f.show.split(' ').map(w=>`<span class="w">${w}</span>`).join('')}</div>`).join('')}</div>`+(c.id=='fecho'?'<div class="fim-sel">coroinhas.jcbplimeira.com.br</div>':'');
 world.appendChild(s);
 const n=document.createElement('div');n.className='no';n.style.left=(i*(880/(T.cenas.length-1)))+'px';prog.appendChild(n);
});
const nos=[...prog.querySelectorAll('.no')],cam={x:0},tl=gsap.timeline({paused:true});
const digita=(id,txt,ini,dur,mascara)=>{const el=document.getElementById(id),o={n:0};tl.to(o,{n:txt.length,duration:dur,ease:'none',onUpdate(){const k=Math.round(o.n);el.textContent=mascara?'•'.repeat(k):txt.slice(0,k);}},ini);};
T.cenas.forEach((c,i)=>{
 const s=document.getElementById('s-'+c.id),t0=c.inicio,t1=t0+1.05,f=c.frases;
 if(i>0)tl.to(cam,{x:-i*1080,duration:1.0,ease:SaaS},t0-0.05);
 tl.to(cheio,{width:(i/(T.cenas.length-1))*880,duration:1.0,ease:SaaS},t0-0.05);
 tl.to(nos[i],{background:'#e8b94a',borderColor:'#ffd97a',scale:1.35,duration:.5,ease:'back.out(2.2)'},t0+.5);
 const alvo=s.querySelector('.fone')||s.querySelector('.brasao');
 tl.from(alvo,{y:90,scale:.9,opacity:0,duration:.9,ease:'back.out(1.4)'},t1-.35);
 tl.from(s.querySelector('.glow'),{opacity:0,scale:.7,duration:1.2,ease:'power3.out'},t1-.35);
 tl.from(s.querySelectorAll('.chave .l'),{yPercent:60,opacity:0,duration:.55,ease:'back.out(1.7)',stagger:.045},t1);
 tl.from(s.querySelector('.fio'),{scaleX:0,duration:.7,ease:SaaS},t1+.25);
 if(c.id=='entrar'){digita('tx-user','joaosilva',f[1].inicio+.2,Math.min(2.4,f[1].dur-.4));
  digita('tx-pass','coroinha',f[2].inicio+.1,1.4,true);
  tl.to('#btn-entrar',{scale:.94,duration:.12,yoyo:true,repeat:1},f[2].inicio+f[2].dur-.2);}
 if(c.id=='senha'){digita('tx-n1','novasenha',f[0].inicio+1.5,1.8,true);digita('tx-n2','novasenha',f[1].inicio+.1,1.6,true);
  tl.to('#btn-salvar',{scale:.94,duration:.12,yoyo:true,repeat:1},f[1].inicio+f[1].dur-.1);}
 if(c.id=='inicio'){tl.from(s.querySelectorAll('.card'),{x:60,opacity:0,duration:.6,ease:'power3.out',stagger:.5},f[0].inicio+.3);}
 if(c.id=='escala'){tl.from(s.querySelectorAll('.card'),{x:60,opacity:0,duration:.6,ease:'power3.out',stagger:.4},f[0].inicio+.2);
  tl.to('#btn-aus',{background:'rgba(232,185,74,.2)',scale:1.04,duration:.4,yoyo:true,repeat:1},f[1].inicio+1.2);}
 if(c.id=='avisos'){tl.from('#toast',{y:-120,opacity:0,duration:.7,ease:'back.out(1.6)'},f[0].inicio+.4);
  tl.add(()=>document.getElementById('sw1').classList.add('on'),f[0].inicio+2.8);}
 f.forEach((fr,fi)=>{const el=s.querySelectorAll('.leg .fr')[fi],ws=el.querySelectorAll('.w');
  tl.fromTo(ws,{opacity:0,y:26},{opacity:1,y:0,duration:.4,ease:'power3.out',stagger:Math.min(.085,(fr.dur*.55)/ws.length)},fr.inicio);
  tl.to(el,{opacity:0,y:-18,duration:.3,ease:'power2.in'},fr.inicio+fr.dur+.04);});
});
const alvos=[...document.querySelectorAll('.fone,.brasao')];
function seek(t){document.getElementById('sw1').classList.remove('on');tl.time(t);
 // o interruptor liga por callback; refaz o estado ao procurar para trás
 const av=T.cenas.find(c=>c.id=='avisos');if(av&&t>=av.frases[0].inicio+2.8)document.getElementById('sw1').classList.add('on');
 const dx=Math.sin(t*.55)*7,dy=Math.cos(t*.43)*9;world.style.transform=`translate3d(${cam.x+dx}px,${dy}px,0)`;}
window.seek=seek;window.ready=document.fonts.ready.then(()=>true);seek(0);
</script></body></html>
