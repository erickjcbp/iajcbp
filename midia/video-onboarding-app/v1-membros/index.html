<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Sua jornada – Coroinhas e Acólitos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0406;--wine:#e01228;--gold:#e8b94a;--gold-l:#ffd97a;--text:#f7ebe7;--muted:#b99a96;--line:rgba(247,235,231,.14)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 900px at 50% 36%,#2a0d15 0%,#12060a 55%,#0a0406 100%)}
#world{position:absolute;left:0;top:0;height:1920px}
.scene{position:absolute;top:0;width:1080px;height:1920px;overflow:hidden;perspective:1500px}
.topo{position:absolute;z-index:5;left:90px;top:70px;width:900px;font:600 28px/1 "Plus Jakarta Sans",sans-serif;color:var(--muted)}
#prog{position:absolute;z-index:5;left:90px;top:124px;width:900px;height:20px}
#prog .trilho{position:absolute;left:10px;right:10px;top:9px;height:2px;background:var(--line)}
#prog .cheio{position:absolute;left:10px;top:9px;height:2px;width:0;background:linear-gradient(90deg,var(--wine),var(--gold))}
#prog .no{position:absolute;top:0;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid rgba(247,235,231,.3)}
.glow{position:absolute;left:90px;top:170px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,74,.26),transparent 65%)}
.raios{position:absolute;left:-60px;top:-60px;width:1200px;height:1200px;opacity:.5;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(232,185,74,.2) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%)}
.brasao{position:absolute;left:240px;top:200px;width:600px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.fone{position:absolute;left:260px;top:180px;width:560px;height:1000px;border-radius:70px;background:#050203;border:3px solid #4a363b;box-shadow:0 50px 100px rgba(0,0,0,.7),0 0 70px rgba(232,185,74,.14);padding:18px;transform-style:preserve-3d}
.vis{position:relative;width:524px;height:964px;border-radius:54px;overflow:hidden;background:#12060a}
.shot{position:absolute;inset:0;overflow:hidden;background:#12060a}
.shot>img{position:absolute;left:0;top:0;width:524px;display:block}
.hd,.nv{position:absolute;left:0;width:524px;background-size:524px auto;background-repeat:no-repeat}
.hd{top:0;height:65px;background-position:top}.nv{bottom:0;height:79px;background-position:bottom}
.chip{position:absolute;z-index:4;padding:20px 32px;border-radius:50px;background:linear-gradient(135deg,#ffd97a,#e8b94a);color:#2a0d15;font:800 36px/1 Sora,sans-serif;white-space:nowrap;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.voa{position:absolute;z-index:4;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,0,0,.6))}
.sp{position:absolute;z-index:3;width:10px;height:10px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 14px var(--gold)}
.foco{position:absolute;z-index:3;border:4px solid var(--gold-l);border-radius:18px;box-shadow:0 0 34px rgba(255,217,122,.65)}
.dig{position:absolute;display:flex;align-items:center;padding-left:18px;background:#1b0a0e;color:var(--text);font:600 22px/1 "Plus Jakarta Sans"}
.toque{position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.55)}
.chave{position:absolute;z-index:5;left:90px;top:1236px;font:800 190px/1 Sora,sans-serif;letter-spacing:-7px;color:var(--gold-l);white-space:nowrap}
.chave .l{display:inline-block}
.fio{position:absolute;z-index:5;left:90px;top:1456px;width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--wine),var(--gold));transform-origin:left}
.leg{position:absolute;z-index:5;left:90px;top:1494px;width:900px;height:300px;font:600 56px/1.26 "Plus Jakarta Sans",sans-serif;color:var(--text)}
.leg .fr{position:absolute;left:0;top:0;width:900px}
.leg .w{display:inline-block;margin-right:.26em;opacity:0}
</style></head><body>
<div id="stage">
 <div class="topo">Pastoral dos Coroinhas e Acólitos · JCBP Limeira</div>
 <div id="prog"><div class="trilho"></div><div class="cheio"></div></div>
 <div id="world"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="tempos.js"></script>
<script>
gsap.registerPlugin(CustomEase);
const SaaS=CustomEase.create('saas','.86,0,.07,1'),E=524/390; // 1 px da tela do app vira E px no vídeo
const shot=(n,i)=>`<div class="shot" data-i="${i}"><img src="telas/${n}.png"><div class="hd" style="background-image:url(telas/${n}-tela.png)"></div><div class="nv" style="background-image:url(telas/${n}-tela.png)"></div></div>`;
const TELAS={niveis:['index','conquistas'],aventuras:['missoes'],medalhas:['conquistas'],casas:['minha-casa'],temporada:['destaques']};
const fone=c=>{if(c=='entrar')return `<div class="fone"><div class="vis"><div class="shot" data-i="0"><img src="telas/login.png"><div class="dig" id="d-user" style="left:${29*E}px;top:${226*E}px;width:${332*E}px;height:${40*E}px"></div><div class="dig" id="d-pass" style="left:${29*E}px;top:${297*E}px;width:${332*E}px;height:${40*E}px"></div><div class="toque" id="toque" style="left:${195*E-45}px;top:${372*E-45}px"></div></div>${shot('index',1)}</div></div>`;
 return `<div class="fone"><div class="vis">${TELAS[c].map(shot).join('')}</div></div>`;};
const world=document.getElementById('world');world.style.width=T.cenas.length*1080+'px';
const prog=document.getElementById('prog'),cheio=prog.querySelector('.cheio');
T.cenas.forEach((c,i)=>{const s=document.createElement('section'),ponta=!TELAS[c.id]&&c.id!='entrar';s.className='scene';s.style.left=i*1080+'px';s.id='s-'+c.id;
 s.innerHTML=`${ponta?'<div class="raios"></div>':''}<div class="glow"></div>${ponta?'<img class="brasao" src="arte/brasao-pastoral.png">':fone(c.id)}
 <div class="chave" style="font-size:${Math.min(190,Math.floor(900/(c.chave.length*0.6)))}px">${[...c.chave].map(ch=>`<span class="l">${ch==' '?'&nbsp;':ch}</span>`).join('')}</div><div class="fio"></div>
 <div class="leg">${c.frases.map(f=>`<div class="fr">${f.show.split(' ').map(w=>`<span class="w">${w}</span>`).join('')}</div>`).join('')}</div>`;
 world.appendChild(s);const n=document.createElement('div');n.className='no';n.style.left=(i*(880/(T.cenas.length-1)))+'px';prog.appendChild(n);});
const nos=[...prog.querySelectorAll('.no')],cam={x:0},tl=gsap.timeline({paused:true});
const rola=(s,i,css,ini,dur)=>{const im=s.querySelector(`.shot[data-i="${i}"]>img`);tl.to(im,{y:-css*E,duration:dur,ease:'power2.inOut'},ini);};
const troca=(s,i,ini)=>tl.fromTo(s.querySelector(`.shot[data-i="${i}"]`),{xPercent:100},{xPercent:0,duration:.6,ease:SaaS},ini);
const soco=(s,esc,ori,ini,dur=.7)=>{const f=s.querySelector('.fone');tl.set(f,{transformOrigin:ori},ini);tl.to(f,{scale:esc,duration:dur,ease:SaaS},ini);};
const chip=(s,txt,lado,top,ini)=>{const e=document.createElement('div');e.className='chip';e.textContent=txt;e.style[lado]='34px';e.style.top=top+'px';s.appendChild(e);
 tl.fromTo(e,{scale:0,rotate:lado=='left'?-14:14,opacity:0},{scale:1,rotate:lado=='left'?-4:4,opacity:1,duration:.5,ease:'back.out(2.6)'},ini);tl.to(e,{y:-14,duration:1,ease:'sine.inOut',yoyo:true,repeat:1},ini+.5);};
const voa=(s,src,x,y,w,ini)=>{const e=document.createElement('img');e.className='voa';e.src=src;e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${w}px`;s.appendChild(e);
 tl.fromTo(e,{x:540-x-w/2,y:680-y-w/2,scale:.1,rotate:-120,opacity:0},{x:0,y:0,scale:1,rotate:0,opacity:1,duration:.75,ease:'back.out(1.5)'},ini);tl.to(e,{y:-18,rotate:6,duration:1.2,ease:'sine.inOut',yoyo:true,repeat:3},ini+.75);};
const digita=(id,txt,ini,dur,masc)=>{const el=document.getElementById(id),o={n:0};tl.to(o,{n:txt.length,duration:dur,ease:'none',onUpdate(){const k=Math.round(o.n);el.textContent=masc?'•'.repeat(k):txt.slice(0,k);}},ini);};
const SPS=[];
T.cenas.forEach((c,i)=>{const s=document.getElementById('s-'+c.id),t0=c.inicio,t1=t0+1.05,f=c.frases,fo=s.querySelector('.fone');
 for(let k=0;k<26;k++){const p=document.createElement('div');p.className='sp';s.appendChild(p);SPS.push({p,x:(k*197)%1080,v:40+(k*37)%90,f:k*.7,r:.4+((k*13)%10)/12});}
 if(i>0)tl.to(cam,{x:-i*1080,duration:.8,ease:SaaS},t0-.05);
 tl.to(cheio,{width:(i/(T.cenas.length-1))*880,duration:.8,ease:SaaS},t0-.05);
 tl.to(nos[i],{background:'#e8b94a',borderColor:'#ffd97a',scale:1.35,duration:.5,ease:'back.out(2.2)'},t0+.5);
 if(fo)tl.fromTo(fo,{y:300,rotateY:i%2?-32:32,rotateX:12,scale:.8,opacity:0},{y:0,rotateY:i%2?-7:7,rotateX:0,scale:1,opacity:1,duration:1,ease:'power3.out'},t0+.45);
 else tl.fromTo(s.querySelector('.brasao'),{scale:.5,opacity:0,rotate:-8},{scale:1,opacity:1,rotate:0,duration:1.1,ease:'back.out(1.6)'},t0+.5);
 tl.from(s.querySelectorAll('.chave .l'),{yPercent:70,opacity:0,rotate:8,duration:.5,ease:'back.out(2)',stagger:.04},t1);
 tl.from(s.querySelector('.fio'),{scaleX:0,duration:.6,ease:SaaS},t1+.25);
 const a=f[0].inicio,b=f[f.length-1].inicio;
 if(c.id=='niveis'){tl.set(s.querySelector('.shot[data-i="1"]'),{xPercent:100},0);rola(s,0,300,a+.2,1.6);soco(s,1.08,'50% 40%',a+.2);
  ['Aspirante','Coroinha','Acólito Guardião','Sentinela','Cerimoniário Mor'].forEach((n,k)=>chip(s,n,k%2?'right':'left',260+k*170,a+.5+k*(f[0].dur-1)/5));
  troca(s,1,f[1].inicio-.1);soco(s,1,'50% 50%',f[1].inicio-.1);rola(s,1,120,f[1].inicio+.6,2);}
 if(c.id=='aventuras'){soco(s,1.06,'50% 50%',a);rola(s,0,500,a+.1,1.8);rola(s,0,810,a+2.2,1.6);rola(s,0,1500,a+4.2,3.2);
  chip(s,'Jogue agora','left',330,a+2.3);chip(s,'Descobertas','right',560,a+4.1);chip(s,'Com a galera','left',800,a+6);chip(s,'Caso aberto','right',380,f[1].inicio+.2);}
 if(c.id=='medalhas'){rola(s,0,1090,a,1.5);rola(s,0,1800,a+1.7,f[0].dur+f[1].dur);soco(s,1.05,'50% 55%',a+1.5);
  ['calice-bronze','coracao-prata','estrela-ouro','coroa-ouro','espadas-ouro','livro-prata'].forEach((m,k)=>voa(s,`arte/${m}.webp`,k%2?860:20,230+Math.floor(k/2)*300,200,a+1+k*.34));chip(s,'+10 XP','right',170,a+.7);}
 if(c.id=='casas'){rola(s,0,222,a+.3,f[0].dur*.8);['sanctaris','seraphim','templaris','veritatis','consilium'].forEach((n,k)=>voa(s,`arte/${n}.png`,k%2?830:10,200+Math.floor(k/2)*320+(k==4?0:0),240,a+.4+k*.7));chip(s,'Seleção no início de 2027','left',1100,f[0].inicio+f[0].dur-3.2);}
 if(c.id=='temporada'){soco(s,1.08,'50% 35%',a+.2);chip(s,'Ranking de XP','left',270,a+.6);chip(s,'Por liga','right',520,a+1.8);chip(s,'Campeão vira Destaque','left',1060,a+f[0].dur-2.2);chip(s,'4 casas em 2027','right',650,f[1].inicio+.3);
  const lg=document.createElement('div');lg.className='foco';fo.querySelector('.vis').appendChild(lg);lg.style.cssText=`left:${14*E}px;top:${435*E}px;width:${362*E}px;height:${60*E}px`;tl.from(lg,{opacity:0,scale:1.3,duration:.45,ease:'back.out(2)'},a+2.6);}
 if(c.id=='entrar'){tl.set(s.querySelector('.shot[data-i="1"]'),{xPercent:100},0);soco(s,1.1,'50% 25%',a+.2);chip(s,'Link nas mensagens','right',860,a+.3);
  digita('d-user','joaosilva',f[1].inicio+.2,1.3);digita('d-pass','senhadafolha',f[1].inicio+1.6,1.2,true);
  tl.fromTo('#toque',{scale:0,opacity:.9},{scale:2.4,opacity:0,duration:.5,ease:'power2.out'},f[1].inicio+3);troca(s,1,f[1].inicio+3.3);soco(s,1,'50% 50%',f[1].inicio+3.3);chip(s,'Crie uma senha só sua','left',1040,f[1].inicio+3.5);}
 if(!fo){const rs=s.querySelector('.raios');tl.fromTo(rs,{rotate:0},{rotate:120,duration:Math.max(c.fim-t0,3),ease:'none'},t0);}
 f.forEach((fr,fi)=>{const el=s.querySelectorAll('.leg .fr')[fi],ws=el.querySelectorAll('.w');
  tl.fromTo(ws,{opacity:0,y:36,scale:.8},{opacity:1,y:0,scale:1,duration:.34,ease:'back.out(2.2)',stagger:Math.min(.09,(fr.dur*.55)/ws.length)},fr.inicio);
  tl.to(el,{opacity:0,y:-22,duration:.26,ease:'power2.in'},fr.inicio+fr.dur+.04);});
});
function seek(t){tl.time(t);const dx=Math.sin(t*.55)*6,dy=Math.cos(t*.43)*7;world.style.transform=`translate3d(${cam.x+dx}px,${dy}px,0)`;
 SPS.forEach(o=>{const y=1240-((t*o.v+o.f*170)%1240);o.p.style.transform=`translate(${o.x+Math.sin(t+o.f)*34}px,${y}px) scale(${o.r})`;o.p.style.opacity=.15+.55*Math.abs(Math.sin(t*.8+o.f));});}
window.seek=seek;window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>true);seek(0);
</script></body></html>
