<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Integração – Pastoral dos Coroinhas e Acólitos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0406;--surf:#16090d;--wine:#e01228;--wine-dim:#7a0f1a;--gold:#e8b94a;--gold-l:#ffd97a;--text:#f7ebe7;--muted:#b99a96}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 900px at 50% 38%,#2a0d15 0%,#12060a 55%,#0a0406 100%)}
#world{position:absolute;left:0;top:0;height:1920px;will-change:transform}
.scene{position:absolute;top:0;width:1080px;height:1920px;overflow:hidden}
.arte{position:absolute;left:0;width:1080px;top:190px;height:820px;display:grid;place-items:center}
.arte svg{width:820px;height:820px;overflow:visible;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}

.arte .foto{max-width:1000px;max-height:840px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55))}
.glow{position:absolute;left:140px;top:240px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,74,.22),transparent 65%)}
.chave{position:absolute;left:90px;top:1000px;font:800 236px/1 Sora,sans-serif;letter-spacing:-8px;color:var(--gold-l);white-space:nowrap}
.chave .l{display:inline-block}
.fio{position:absolute;left:90px;top:1262px;width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--wine),var(--gold));transform-origin:left}
.leg{position:absolute;left:90px;top:1310px;width:900px;height:380px;font:600 60px/1.28 "Plus Jakarta Sans",sans-serif;color:var(--text)}
.leg .fr{position:absolute;left:0;top:0;width:900px}
.leg .w{display:inline-block;margin-right:.26em;opacity:0}
.topo{position:absolute;left:90px;top:96px;width:900px;font:600 28px/1 "Plus Jakarta Sans",sans-serif;color:var(--muted)}
#prog{position:absolute;left:90px;top:160px;width:900px;height:20px}
#prog .trilho{position:absolute;left:10px;right:10px;top:9px;height:2px;background:rgba(247,235,231,.16)}
#prog .cheio{position:absolute;left:10px;top:9px;height:2px;width:0;background:linear-gradient(90deg,var(--wine),var(--gold))}
#prog .no{position:absolute;top:0;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid rgba(247,235,231,.3)}
.bolha{position:absolute;left:560px;top:868px;padding:26px 46px;border-radius:50px 50px 10px 50px;white-space:nowrap;background:#0b5f4a;color:#eafff6;font:600 58px/1 "Plus Jakarta Sans",sans-serif;box-shadow:0 30px 60px rgba(0,0,0,.5);transform-origin:90% 90%;opacity:0}
.bolha small{display:block;margin-top:10px;font-size:24px;font-weight:500;opacity:.7;text-align:right}
</style></head><body>
<div id="stage">
 <div class="topo">Pastoral dos Coroinhas e Acólitos · JCBP Limeira</div>
 <div id="prog"><div class="trilho"></div><div class="cheio"></div></div>
 <div id="world"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="tempos.js"></script><script src="arte.js"></script>
<script>
gsap.registerPlugin(CustomEase);
const SaaS=CustomEase.create('saas','.86,0,.07,1');
const ICONES=window.ARTE;const imgOuSvg=id=>`<img class="foto" src="arte/${id}.png" alt="" onerror="this.outerHTML=window.ARTE['${id}']">`;document.body.insertAdjacentHTML('afterbegin',window.ARTE_DEFS);
const world=document.getElementById('world');world.style.width=T.cenas.length*1080+'px';
const prog=document.getElementById('prog'),cheio=prog.querySelector('.cheio');
T.cenas.forEach((c,i)=>{
 const s=document.createElement('section');s.className='scene';s.style.left=i*1080+'px';s.id='s-'+c.id;
 s.innerHTML=`<div class="glow"></div><div class="arte ${i==0||i==T.cenas.length-1?'brasao':''}">${imgOuSvg(c.id)}</div>
  <div class="chave" style="font-size:${Math.min(236,Math.floor(900/(c.chave.length*0.6)))}px">${[...c.chave].map(ch=>`<span class="l">${ch==' '?'&nbsp;':ch}</span>`).join('')}</div><div class="fio"></div>
  <div class="leg">${c.frases.map(f=>`<div class="fr">${f.show.split(' ').map(w=>`<span class="w">${w}</span>`).join('')}</div>`).join('')}</div>
  ${c.id=='fecho'?'<div class="bolha"><span>li e entendi</span><small>✓✓ agora</small></div>':''}`;
 world.appendChild(s);
 const n=document.createElement('div');n.className='no';n.style.left=(i*(880/(T.cenas.length-1)))+'px';prog.appendChild(n);
});
const nos=[...prog.querySelectorAll('.no')],cam={x:0},tl=gsap.timeline({paused:true});
T.cenas.forEach((c,i)=>{
 const s=document.getElementById('s-'+c.id),t0=c.inicio;
 // câmera viaja de uma cena à outra pela curva SaaS
 if(i>0)tl.to(cam,{x:-i*1080,duration:1.0,ease:SaaS},t0-0.05);
 const barra=(i/(T.cenas.length-1))*880;
 tl.to(cheio,{width:barra,duration:1.0,ease:SaaS},t0-0.05);
 tl.to(nos[i],{background:'#e8b94a',borderColor:'#ffd97a',scale:1.35,duration:.5,ease:'back.out(2.2)'},t0+.5);
 const t1=t0+1.05;
 tl.from(s.querySelector('.arte').children[0],{scale:.82,rotate:-4,opacity:0,duration:.9,ease:'back.out(1.5)'},t1-.35);
 tl.from(s.querySelector('.glow'),{opacity:0,scale:.7,duration:1.2,ease:'power3.out'},t1-.35);
 tl.from(s.querySelectorAll('.chave .l'),{yPercent:60,opacity:0,duration:.55,ease:'back.out(1.7)',stagger:.045},t1);
 tl.from(s.querySelector('.fio'),{scaleX:0,duration:.7,ease:SaaS},t1+.25);
 const ds=s.querySelectorAll('svg .d');if(ds.length){ds.forEach(p=>{const L=p.getTotalLength?p.getTotalLength():300;gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});tl.to(p,{strokeDashoffset:0,duration:1.3,ease:'power2.inOut'},t1-.2);});}
 if(c.id=='escala'){tl.from(s.querySelectorAll('svg .on'),{scale:0,transformOrigin:'center',duration:.5,ease:'back.out(3)',stagger:.35},t0+4.0);}
 if(c.id=='chegada'){tl.from(s.querySelector('#arco'),{opacity:0,duration:.6},t1+.8);}
 c.frases.forEach((f,fi)=>{const fr=s.querySelectorAll('.leg .fr')[fi],ws=fr.querySelectorAll('.w');
  // cada frase nasce palavra a palavra quando a voz começa e sai suavemente quando a próxima chega
  tl.fromTo(ws,{opacity:0,y:26},{opacity:1,y:0,duration:.4,ease:'power3.out',stagger:Math.min(.085,(f.dur*.55)/ws.length)},f.inicio);
  const fim=f.inicio+f.dur+.04;tl.to(fr,{opacity:0,y:-18,duration:.3,ease:'power2.in'},fim);
 });
 if(c.id=='fecho'){const b=s.querySelector('.bolha'),f0=c.frases[0];
  tl.fromTo(b,{opacity:0,scale:.6,y:60},{opacity:1,scale:1,y:0,duration:.7,ease:'elastic.out(1,.55)'},f0.inicio+f0.dur-.2);
  tl.to(b,{scale:.94,duration:.12,ease:'power2.in'},f0.inicio+f0.dur+.7).to(b,{scale:1,duration:.5,ease:'elastic.out(1,.5)'},f0.inicio+f0.dur+.82);}
});
const arteEls=[...document.querySelectorAll('.arte')];
function seek(t){tl.time(t);if(window.viva)viva(t);const dx=Math.sin(t*.55)*7,dy=Math.cos(t*.43)*9;
 world.style.transform=`translate3d(${cam.x+dx}px,${dy}px,0)`;
 arteEls.forEach((a,i)=>{a.style.transform=`translateY(${Math.sin(t*.9+i)*14}px) rotate(${Math.sin(t*.5+i)*1.1}deg)`;});}
window.seek=seek;window.ready=document.fonts.ready.then(()=>true);
seek(0);
</script></body></html>
